# v0.5 arm of support's real test (docs/design/V0_5_PLAN.md §3; docs/ROADMAP.md §3 "v0.5（2026-10-06 决定）" step 3).
# The v0.4 arm is claude-v4-support.toml; the two run at EQUAL BUDGETS on the SAME split, root, final share, per-attempt
# limits, actor, research model and pricing. This file differs from claude-v4-support.toml in three values only:
# [workspace] root, [rsi] scope_id and [improvement] preset (automationbench_harness_v5: the v3 preset as of v0.4 plus
# the `methods` and `library` tables, which a config cannot change) — and in [estimate], a planning number that is
# never a limit. Offline checks of this file pass; nothing in it has been run (2026-10-06).
#
# The split is the one workspace-claude-v3 froze for support (stratified rule, seed 1, 50/25/25), pinned to its hash
# 3da11232f5d5ff38, so the 25 test tasks are the same never-read ones the v0.4 arm's final reads. Both finals are sealed
# and their plan hashes committed before either final runs (the test chooses nothing).
#
# Run in STAGES, stopping after each for analysis (V0_5_PLAN §3; ROADMAP v0.5 step 3):
#   3a  `ouroloop bench --config examples/automationbench/claude-v5-support.toml --phase cycle --until baseline`
#       W0 on train 50 + dev 25 x 3 readings                                                                ~$58
#   3b  `... --phase library`: the experience library's stream over the 50 train tasks (first encounter under
#       W0 + the library so far, leave-one-out; one retry with the failed checks after a failure; distillation of
#       every new success) and, unless D <= 0 or B >= 3 at its end, the n = 50 snapshot in a fixed round: screen
#       (W0's failing train tasks + 6 passing, leave-one-out), gate, confirmation, install              ~$46-86
#   3c  `... --phase cycle`: R's rounds with the method library (one segment, 3 rounds, patience 2); the root stops
#       it first if the money runs out — that is the equal budget                                         ~$40 a round
#   3d  only when a method is installed and the improvement share still holds it: `... --phase learn` (the twins on
#       the train tasks where a trigger fires, <= 24 x 2 attempts; the fit; a refit round if the table moved) <= $54.50
#   3e  [freeze.final] below with W*, `ouroloop freeze`, commit the plan hash (before either arm's final runs),
#       `--phase evaluate`: support's 25 test tasks x 3, W0 against W*, W0's pass@k beside it             ~$72
# After every step read the free process checks (ROADMAP v0.5 step 3): 0 false literal refusals; every candidate
# grounded by its reads; every method candidate past the reach floor; 0 write calls from an m_ tool; the retrieval's
# leave-one-out audit at 0. If one fails, stop and fix offline.
# Before 3a: `claude auth login` (Max subscription, extra usage off); the worker image as for v0.4 (v0.5 changes no
# byte of worker_runner.py, so an image built for v0.4 at this host's runner still loads); `ouroloop freeze --config
# examples/automationbench/claude-v5-support.toml` prints the split hash (must be 3da11232f5d5ff38) and the [rsi] lines.
#
# Pre-registered readings (V0_5_PLAN §3, committed with the JOURNAL before the first payment, never changed):
#   H1 (v0.5's claim): the two finals paired by task (each task's mean over 3), W*_v5 - W*_v4, 95% bootstrap interval
#      lower bound > 0 -> v0.5 beats v0.4 at equal budget; lower bound <= 0 and point <= 0 -> it does not; else
#      uncertain (the expected outcome: power about 30% at a true +8 points).
#   C1 for each arm: W* - W0, 95% interval lower bound > 0.
#   Process: the library's D, B, learning curve (second half - first half, P >= 0.8) and the credit's rank
#   correlation; >= 1 method candidate past the screen; a learn reading moving a cell with its refit through the gate.
#
# The estimate (V0_5_PLAN §5; unit costs as v0.4's): W0 $0.466 an attempt, an attempt with the library or a method
# ~$0.47-0.50, a distillation ~$0.14 (finance round 1's notes).
#     3a  baseline 125 x $0.466                                                                            $58.25
#     3b  stream: first encounters 50 x $0.47 $23.50 + retries <= 25 x $0.47 $11.75 + distillation <= 75 x $0.14
#         $10.50 = $45.75; the snapshot round (when D > 0 and B <= 2): screen ~33 x $0.47 $15.51 + gate $12.25
#         (+ confirmation $12.25)                                                                     $45.75-86.01
#     3c  a round $39.89 (as v0.4's), a confirmation $12.25, an install's rerun ~$13.23
#     3d  learn <= 48 x $0.50 $24 + refit screen <= $6 + gate $12.25 + confirmation $12.25                <= $54.50
#     expected path (3a + 3b with a confirmed snapshot + two rounds + one install) ~ $237 against the v0.4 arm's
#     $203: at equal roots the root is the binding constraint, and the v0.5 arm's last rounds may be cut. That is the
#     comparison: the same dollars, spent partly on the library and the methods instead of on R's rounds.
#     3e  final: 25 tasks x 3 x ($0.466 + $0.50) = $72.45
#   The root $450 and the final share $160, exactly the v0.4 arm's (its config states the reservation arithmetic).

[workspace]
root = "workspace-claude-v5-support"

[bench]
domains = ["support"]
split_rule = "stratified"       # scored-assertion kinds x tool family, then hashed; the pin below must be reproduced
upstream_path = "~/workspace/AutomationBench"
toolset = "api"
seed = 1                        # the v3 workspace's seed: the same within-stratum order, the same split
concurrency = 8                 # attempts in flight; a machine setting, not part of any plan (M5 §2)
smoke_tasks = 1
near_duplicate_threshold = 0.6
control_readings = 3            # v0.4 (V0_4_PLAN §1.6): W0's dev read 3 times in the baseline, unconditionally

[bench.frozen_splits]           # the split workspace-claude-v3 froze for support (stratified, seed 1), checked by hash
support = "3da11232f5d5ff38"

[bench.ratios]
train = 0.5
dev = 0.25
test = 0.25

[bench.budget]                  # the v3 preset's five hard limits of one attempt (M0 §2), written out
max_steps = 50
max_tool_calls = 200
max_seconds = 900
max_model_calls = 200
max_tokens = 400000

[backends.mock]
type = "mock"

[points]
default_backend = "mock"        # the first version runs no decision model

# The actor W0 pins: Claude Opus 5.5 through headless Claude Code, at effort medium (as the v0.4 arm).
[llm]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 600

# R: notes, the coding session (up to 40 turns a round), and the library's distillation and merge calls.
[research.llm]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 900

[pricing]
input_per_1k = 0.004
cache_read_per_1k = 0.0002
cache_write_per_1k = 0.008
output_per_1k = 0.02
max_input_tokens = 1000000
max_output_tokens = 163840
source = "notional, not a bill: claude-opus-5-5 API list price ($4/$20 per M, cache read $0.20, 1h cache write $8), equal to the CLI's reported cost in the probe (docs/ROADMAP.md §3, step 2a), 2026-10-03"

# The v5 preset (V0_5_PLAN §1): the v3 preset as of v0.4 — k = 3 from one coding session, the gate statistics, v0.4's
# screen and read floors — plus the method library (methods: read-only m_ tools, a call cap of 25, the reach check,
# the applicability learner's freeze rule) and the experience library (library: one snapshot at n = 50, one retry,
# 3 entries shown, 6 a shelf, the checks and the retirement rules). freeze writes both tables into K; R cannot raise
# any of it, and this config cannot change them. A new bootstrap here gets the v5 R0 (the methods paragraph).
[improvement]
mode = "automatic"
preset = "automationbench_harness_v5"
allowed_methods = ["policy_edit", "harness_edit"]
max_candidates_per_round = 3
max_collection_batches = 2      # per worker segment; a restart does not reset it

[harness_evolution]             # the preset's own values, written out (a value here may narrow, never widen)
package_api = "harness_package.v2"
components = ["agent", "memory", "skills", "on_finish", "before_tool", "after_tool", "tools"]
sandbox = "docker"
max_files = 24
max_package_bytes = 262144
test_timeout_seconds = 30
max_draft_repairs = 3           # revisions after the first draft, so at most 4 drafts
max_failure_notes = 30          # notes one round reads, cached and new together (support W0 fails ~27 train tasks)
max_effort = "medium"           # lowered from the preset's high (tighten-only, frozen into K): as the v0.4 arm

[harness_evolution.research_session]
max_turns = 40
max_edits = 24
max_trajectory_bytes = 65536
max_trajectory_bytes_total = 524288
min_failing_reads = 1
min_passing_reads = 1

[harness_evolution.screen]
passing_sample = 6
min_net_flips = 0
min_fixes = 1
max_sample_regressions = 1

[rsi]
profile = "task"
scope_id = "support-claude-v5"
stop_view = "stop.business.v1"
repeats = 1
order_seed = 1
# task_plan_ref / schedule_ref / budget_ref: add the lines `ouroloop freeze` prints (before 3a).

# One segment of 3 worker rounds and no research slot, patience 2: as the v0.4 arm.
[freeze.schedule]
worker_rounds = 3
research_slots = 0
patience = 2

# The activity's budget in notional dollars at [pricing]: $450, the v0.4 arm's root, a hard stop fixed when the root
# opens (3a). The final's share is set aside on the same root from the start.
[freeze.budget]
usd = 450.0

[freeze.budget.final]
usd = 160.0

# Planning numbers for the final's estimate where an arm has no priced reading yet (bench.estimate_settings); never a
# limit. An attempt with the library or a method is planned at $0.50.
[estimate]
cost_per_attempt = {base = 0.466, evolved = 0.50}

# The final comparison, filled in after 3c/3d and sealed before any test task is read by either arm (V0_5_PLAN §3):
# W0 against W* on support's 25 test tasks, repeats 3, W0's pass@k beside W*. H1 pairs this final's W* with the v0.4
# arm's W* by task; its plan hash is committed before `--phase evaluate` runs; the result is reported whatever it is.
