# ouroloop gate freeze --config examples/ouroloop.toml     # once, by a person: every promotion's gate
# ouroloop research    --config examples/ouroloop.toml --rounds 3
# ouroloop evolve      --config examples/ouroloop.toml
# Paths are relative to this file. Gate parameters (test sessions, risk, data checks) live in the frozen gate
# template, workspace/gates/template.json, never here.

[workspace]
root = "workspace"          # ledger/, sessions/, harness/, models/, experience.jsonl

[backends.mock]
type = "mock"

[backends.jev]
type = "jev"
model = "jev-1.13.0"        # pin the version: thresholds are fitted against one model

[registry]
base = "jev"                # what "champion" means before the first trained model is promoted

[points]
default_backend = "jev"

[points.retry]
define = "ouroloop.points:retry_point"   # a function returning a DecisionPoint (optional for built-in points)
backend = "champion"        # the latest promoted model; research and evolve can replace it

[llm]                       # the reasoning model of the agent and the research agent (pip install "ouroloop[anthropic]")
type = "anthropic"
model = "claude-opus-5"

# [llm_small]               # optional: a cheaper model for the steps the route point sends to the small tier
# type = "anthropic"
# model = "claude-haiku-4-5"

[research]
agent = "ouroloop.research.basic:BasicResearcher"   # swap in your own class here
judge = "jev"               # who makes the research judgments

[research.options]
budget = 2

[trainer]                   # a trainer plugin as a job on a GPU machine over ssh; the run stays there
type = "tde"                # the plugin (ouroloop/trainers/): "tde", "signature", or your own module
host = "user@gpu-host"      # ssh with a key is all it needs: the first job runs `ouroloop host init` there if the
                            # host lacks this ouroloop or the plugin; "local": this machine's ~/.ouroloop/venv;
                            # leave it out to train on this machine under this Python
# jobs_root = "~/.ouroloop/jobs"    # each job's directory, <jobs_root>/<job id>/, on that machine
# ssh_opts = "-i ~/.ssh/your_key -o BatchMode=yes"
# transport = "hf"          # also commit each run once to a private repository <hf_prefix><job id>; the host
# hf_prefix = "your-org/ouroloop-"  #   needs HF_TOKEN (or `hf auth login`) there
# deadline_s = 28800        # a job is stopped after this long
# poll_s = 30

[trainers.tde]              # the plugin's options (docs/TRAINING_HOSTS.md)
source = "~/tde"            # a TDE checkout here, which host init sends; or a pip requirement, such as
                            # "git+ssh://git@github.com/your-org/tde.git@v0.1.1"
init_from = "~/tde-runs/base"       # the first model's parent run, on the host

[models]                    # how trained models are served: `ouroloop serve` on the GPU machine, from its jobs_root
url = "http://gpu-host:8765"
token_env = "OUROLOOP_TOKEN"

[recipe]                    # overrides of ouroloop.evolve.train.DEFAULT_RECIPE, which the plugin maps to its trainer
replay = "~/tde-data/general/train.jsonl"  # general data on the host, mixed in to avoid forgetting
replay_ratio = 1.0
