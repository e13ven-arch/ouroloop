[solution]
"clean_contacts.py" = '''
import csv
import re
import sys


def main(src, dst):
    with open(src, newline="") as f:
        rows = list(csv.reader(f))
    header, body = rows[0], rows[1:]
    seen = set()
    with open(dst, "w", newline="") as f:
        writer = csv.writer(f)
        writer.writerow(header)
        for row in body:
            name, email, phone = (cell.strip() for cell in row)
            email = email.lower()
            if not email or email in seen:
                continue
            seen.add(email)
            writer.writerow([name, email, re.sub(r"\D", "", phone)])


if __name__ == "__main__":
    main(sys.argv[1], sys.argv[2])
'''
