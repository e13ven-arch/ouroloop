# The second pre-paid rehearsal (docs/REHEARSAL.md §10), for skills, package tools and refills: the production cycle on the fixture world, with the fake actor and R
# answered by hand through the manual provider. Run from this directory, with PYTHONPATH=. so the actor imports:
#   PYTHONPATH=. ../../.venv/bin/python -m ouroloop freeze --config rehearsal2.toml
#   PYTHONPATH=. ../../.venv/bin/python -m ouroloop bench --config rehearsal2.toml --phase cycle --until baseline
# There is no .env here, so no key is read. The prices are placeholders that bound every call, not prices.

[workspace]
root = "workspace-rehearsal2"

[bench]
domain = "marketing"
upstream_path = "upstream"

[bench.budget]
max_steps = 8
max_tool_calls = 12
max_seconds = 60
max_model_calls = 20            # all five hard limits, M0 §2 (docs/modules/00_CONTRACTS.md): act and aux
max_tokens = 4000               # calls together, and the attempt's output tokens, thinking included

[llm]
type = "rehearsal_actor:RehearsalActor"
model = "rehearsal-actor-1"
fault_dir = "workspace-rehearsal2/actor-faults"  # the operator arms one infrastructure fault here (§10.2)

[research.llm]
type = "manual"
dir = "workspace-rehearsal2/manual"       # relative to the directory the CLI runs in: this one
poll = 1.0

[pricing]
input_per_1k = 0.0014
output_per_1k = 0.0044
max_input_tokens = 1000000
max_output_tokens = 32768
source = "rehearsal: placeholder prices that bound each call, not a price list"

[improvement]
mode = "automatic"
preset = "marketing_harness_v1"

[harness_evolution]
max_failure_notes = 1                    # one note per round: the train rotation stages what R sees (§4)

[rsi]
scope_id = "rehearsal-2"

[freeze.budget]
usd = 300

[freeze.budget.final]
usd = 50
