[solution]
"text_utils.py" = '''
import re


def slugify(text):
    """Lowercase text, turn every run of characters that are not letters or digits into a single "-", and strip
    "-" from both ends: slugify("Hello, World!") == "hello-world"."""
    return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")
'''
