# finance-v24: stage 4p at effort "max" (the user, 2026-10-24: "可以用 opus max 跑几道看一下效果会不会更好") — the same
# shape as finance-v23 (items feedback, the unread-source and derived-value guidance, the learn arm only) with the actor
# and the improver both at effort = "max" (every arm the same effort, as the rules require), on three finance TRAIN tasks
# the medium-effort runs did not settle: quarterly_tax_estimate (v20 e3 PASS but fragile, v21/v22 FAIL),
# timesheet_to_invoice (v20 fixed: a reference point), grant_expense_tracking (v16 at medium: 0.75 three times, never
# fixed). The question is only whether the same mechanism reads better at max: first pass, R's session, steady state.
#   1  `... bench --config examples/automationbench/finance-v24.toml --phase smoke --checks-only`                $0
#   2  `... freeze --config ...`; add the printed [rsi] lines (core_ref, split_ref, repeat_plan_ref) and commit    $0
#   3  `... bench --config ... --phase repeat --arm learn` (3 tasks; at max effort perhaps 2-4x the medium cost of
#      $3-6 a task, about $30-60). Approved in chat first (PLAN rule 3).
#   4  `... bench --config ... --phase report`

[workspace]
root = "workspace-finance-v24"

[bench]
domain = "finance"
upstream_path = "~/workspace/AutomationBench"
split_rule = "stratified"
seed = 1
concurrency = 8
ratios = { train = 0.5, dev = 0.0, test = 0.5 }

[model]
type = "claude_code"
model = "claude-opus-5-5"
effort = "max"
max_tokens = 32000
timeout = 600

[research_model]
type = "claude_code"
model = "claude-opus-5-5"
effort = "max"
max_tokens = 32000
timeout = 900

[pricing]
input_per_1k = 0.004
cache_read_per_1k = 0.0002
cache_write_per_1k = 0.008
output_per_1k = 0.02
max_input_tokens = 400000
max_output_tokens = 163840
source = "notional, not a bill: claude-opus-5-5 API list price ($4/$20 per M, cache read $0.20, 1h cache write $8)"

[harness]
preset = "automationbench_v2_max"   # automationbench_v2 with the effort ceiling at max (this experiment only)
seed = "stirrup"

[worker]
network = "none"
image_id = "sha256:e070208dbddc713a9993f6700ab15a0455d44d2f6885f47dafc2f4bfd4436f30"

[memory]
enabled = false

[schedule]
rounds = 1
patience = 1
stream_batch = 30
stream_splits = ["train"]

[budget]
usd = 1000.0

[final]
repeats = 3

[improver]
packages_per_round = 2      # v1.10: candidates/package/ invariant, candidates/package-2/ domain (DESIGN §6.20)
accept_max_regressions = 3  # v1.12 (DESIGN §6.22): net-positive installs, the regressions go to the frontier
accept_floor_tolerance = 3
l5_per_round = 3
trial_max_tasks = 3         # the host's trial after finish, per package; R's own tries share trial_max_attempts (40)

[repeat]
encounters = 3          # each task met three times: the base, then the task's own harness twice
split = "train"         # the focused run stays on train: test is for the sealed number only
tasks = ["finance.quarterly_tax_estimate", "finance.timesheet_to_invoice", "finance.grant_expense_tracking"]
max_probes = 4          # the learn arm's extra executions a task, at most
feedback = "items"      # the bit per attempt and what each rejected run was sent back for (kinds and objects, no values)
concurrency = 3
arms = ["learn"]        # no control arm in the focused run

[rsi]
scope_id = "finance-v24"
seed_from = "workspace-finance-v9"
seed_line = "working"
# frozen 2026-10-24: the seed is finance-v9's working line; the finance two-way split; the repeat plan: the three named
# train tasks x 3 encounters, the learn arm, feedback items, effort max on both arms — sealed before any attempt
core_ref = "core:sha256:48d3e5deb19b66cc86fee700692c92ed28b95d4adca914d4a615f7c1754caf34"
split_ref = "3b959d143f9d8468"
repeat_plan_ref = "repeat_plan:sha256:ace3443a78aedfecb356de111fe46d9fdc2d6bde6a85b7834aba9e4681628858"
