# The pre-paid rehearsal (docs/REHEARSAL.md): the production cycle on the fixture world, with the fake actor and R
# answered by hand through the manual provider. Run from this directory, with PYTHONPATH=. so the actor imports:
#   PYTHONPATH=. ../../.venv/bin/python -m ouroloop freeze --config rehearsal.toml
#   PYTHONPATH=. ../../.venv/bin/python -m ouroloop bench --config rehearsal.toml --phase cycle --until baseline
# There is no .env here, so no key is read. The prices are placeholders that bound every call, not prices.

[workspace]
root = "workspace-rehearsal"

[bench]
domain = "marketing"
upstream_path = "upstream"

[bench.budget]
max_steps = 8
max_tool_calls = 12
max_seconds = 60

[llm]
type = "rehearsal_actor:RehearsalActor"
model = "rehearsal-actor-1"

[research.llm]
type = "manual"
dir = "workspace-rehearsal/manual"       # relative to the directory the CLI runs in: this one
poll = 1.0

[pricing]
input_per_1k = 0.0014
output_per_1k = 0.0044
max_input_tokens = 1000000
max_output_tokens = 32768
source = "rehearsal: placeholder prices that bound each call, not a price list"

[improvement]
mode = "automatic"
preset = "marketing_harness_v1"

[harness_evolution]
max_failure_notes = 1                    # one note per round: the train rotation stages what R sees (§4)

[rsi]
scope_id = "rehearsal"

[freeze.budget]
usd = 300

[freeze.budget.final]
usd = 50
