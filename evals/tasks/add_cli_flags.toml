[solution]
"sort_lines.py" = '''
import argparse


def main(argv=None):
    parser = argparse.ArgumentParser(description="Print the lines of a file in sorted order.")
    parser.add_argument("file")
    parser.add_argument("--reverse", action="store_true", help="reverse sorted order")
    parser.add_argument("--unique", action="store_true", help="drop repeated lines")
    args = parser.parse_args(argv)
    with open(args.file) as f:
        lines = [line.rstrip("\n") for line in f]
    if args.unique:
        lines = set(lines)
    for line in sorted(lines, reverse=args.reverse):
        print(line)


if __name__ == "__main__":
    main()
'''
