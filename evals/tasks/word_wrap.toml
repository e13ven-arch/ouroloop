[solution]
"wrapping.py" = '''
import re


def wrap(text, width):
    """Break text into lines of at most width characters and return them as a list.

    Words are the runs of non-whitespace characters; the whitespace between them, newlines included, only separates
    words. Lines are filled greedily: each line takes as many of the next words as fit, joined by single spaces. A
    word longer than width is first cut into pieces of width characters (the last piece may be shorter), and the
    pieces are then placed like words. Text without words gives []. Raise ValueError if width is less than 1."""
    if width < 1:
        raise ValueError(f"width must be at least 1, not {width}")
    lines = []
    for piece in (w[i:i + width] for w in text.split() for i in range(0, len(w), width)):
        if lines and len(lines[-1]) + 1 + len(piece) <= width:
            lines[-1] += " " + piece
        else:
            lines.append(piece)
    return lines


def fill(text, width):
    """Wrap every paragraph of text on its own and join all the lines with newlines. Paragraphs are separated by one
    or more blank lines (lines that are empty or only whitespace); the result separates them with exactly one empty
    line and has no empty lines at the start or end."""
    paragraphs = [wrap(p, width) for p in re.split(r"\n\s*\n", text)]
    return "\n\n".join("\n".join(lines) for lines in paragraphs if lines)


def shorten(text, width, placeholder="..."):
    """text on one line in at most width characters, with whitespace collapsed as in wrap. If the collapsed text fits,
    return it. Otherwise return as many leading words as fit, then a space and the placeholder, counting that space
    and placeholder in the width; if not even the first word fits, return the placeholder alone:
    shorten("Hello big world", 12) == "Hello ..."."""
    words = text.split()
    if len(" ".join(words)) <= width:
        return " ".join(words)
    while words and len(" ".join(words + [placeholder])) > width:
        words.pop()
    return " ".join(words + [placeholder])
'''
