"test_hidden.py" = '''
import subprocess
import sys
import unittest


def run(*args):
    out = subprocess.run([sys.executable, "sort_lines.py", "words.txt", *args], capture_output=True, text=True,
                         timeout=30)
    return out.stdout.splitlines()


class T(unittest.TestCase):
    def test_default(self):
        self.assertEqual(run(), ["apple", "apple", "banana", "fig", "pear"])

    def test_reverse(self):
        self.assertEqual(run("--reverse"), ["pear", "fig", "banana", "apple", "apple"])

    def test_unique(self):
        self.assertEqual(run("--unique"), ["apple", "banana", "fig", "pear"])

    def test_both(self):
        self.assertEqual(run("--unique", "--reverse"), ["pear", "fig", "banana", "apple"])
