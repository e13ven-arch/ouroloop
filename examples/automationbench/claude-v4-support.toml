# v0.4: support as a single-domain activity (docs/design/V0_4_PLAN.md §1.1; docs/ROADMAP.md §3 "v0.4（2026-10-06 决定）"
# step 3). One domain, its own workspace and its own W*, the v0.1 shape. Offline checks of this file pass; nothing in it
# has been run (2026-10-06).
#
# The split is the one workspace-claude-v3 froze for support: the stratified rule (scored-assertion kinds x tool
# family, from the task definitions only), seed 1, 50/25/25 — pinned below to its hash 3da11232f5d5ff38, so the 25 test
# tasks are the same ones, never read. A pinned split is reproduced under whichever rule reproduces the pin (v0.4,
# bench.freeze_splits); here the stratified rule does, offline, on upstream 4a8e1061 / package 1.0.6 / python 3.12.14.
#
# Run in STAGES, stopping after each for analysis (ROADMAP v0.4 step 3, after the first domain; step 2's stages):
#   2a  `ouroloop bench --config examples/automationbench/claude-v4-support.toml --phase cycle --until baseline`
#       W0 on train 50 + dev 25 x 3 readings (control_readings below)                                       ~$58
#   2b  `... --phase cycle` (one segment of 3 rounds, patience 2; after each round read the free process checks:
#       0 false literal refusals, every candidate grounded by its reads, a tool or hook candidate reaching the screen
#       within the 3 rounds — if one fails, stop and fix offline)                                            ~$120
#   2c  only with a confirmed install, in this order (the v0.4 arm of support's two-arm test, V0_5_PLAN §3):
#       (1) fill [freeze.final] below with W* (rsi/active.json) and W0; (2) `ouroloop freeze --config ...` seals the
#       plan and prints its hash; (3) commit that hash (and the v0.5 arm's, sealed the same way) before EITHER arm's
#       final runs; (4) `--phase evaluate`: support's 25 test tasks x 3, W0 against W*, W0's pass@k beside it   ~$72
#       With no install there is no final for this arm: H1 then pairs the v0.5 final's W* against that final's own
#       W0 arm (this arm's W* is W0), computed by examples/automationbench/support_h1.py.
# Before 2a: `claude auth login` (Max subscription, extra usage off); the worker image rebuilt from
# docker/worker.Dockerfile; `ouroloop freeze --config examples/automationbench/claude-v4-support.toml` prints the split
# hash (must be 3da11232f5d5ff38) and the [rsi] lines to add (task_plan_ref, schedule_ref, budget_ref).
#
# Pre-registered reading (V0_4_PLAN §3): a confirmed install -> the sealed final; no install in 3 rounds -> stop and
# report it; a significant final (interval above 0) -> sales and hr next, each a single-domain activity like this one.
# As the v0.4 arm of support's two-arm test (V0_5_PLAN §3, 2026-10-07): H1 pairs this arm's final with the v0.5 arm's.
#
# The estimate (2026-10-06) from v0.3's measured unit costs: W0 $0.466 an attempt (the five-domain baseline, 377
# attempts), a candidate $0.49 (the v0.3 gates' candidate arms); one call reserves 1M in x $4/M + 163,840 out x $20/M =
# $7.2768.
#     2a  baseline: (50 train + 25 dev x 3 readings) = 125 x $0.466                                         $58.25
#     2b  a round: R's notes and session at k = 3 ~$10 + screen ~3 x (6 failing + 6 sample) = 36 x $0.49 $17.64
#             + dev gate 25 x $0.49 $12.25 (the control is pooled: no control arm) = $39.89
#         + a confirmation 25 x $0.49 $12.25 when a first reading clears min_gain; + after an install the previous
#           version's train failures rerun, ~27 x $0.49 $13.23 (support W0 passes 46% of train)
#         3 rounds $119.67 + one confirmation + one install = $145.15
#     spend before the final $58.25 + $145.15 = $203.40
#     2c  final: 25 tasks x 3 x ($0.466 + $0.49) = $71.70
#   Reservations: 8 lanes in flight $58.21; settlements that never come back keep theirs (about 1 in 2,250 calls in
#   v0.1-v0.3): ~360 attempts x 8.6 calls + ~210 R calls ~ 3,306 calls before the final -> 2 stuck, $14.55; the final
#   ~1,290 calls -> 1 stuck.
#   The final share $160: the expected $71.70 + 8 lanes $58.21 + 2 stuck $14.55 = $144.46, and room for a dearer W*:
#   160 - 58.21 - 14.55 = $87.24 over 75 attempts of each arm = $1.163 for W0 + W*, so W* up to $0.697 beside W0's
#   $0.466 — above the gate's own cost allowance at a gain of 0.10 ($0.466 x (1 + 0.10 + 2.0 x 0.10) = $0.606).
#   The root this arm needs = $203.40 + 8 lanes $58.21 + 2 stuck $14.55 + the final share $160 = $436.16 ($450 before
#   2026-10-07). The root is $600 (the v0.5 review's decision, 2026-10-07): equal to the v0.5 arm's, so support's two
#   arms run at EQUAL CAPS and the SAME SCHEDULE (3 rounds, patience 2). This arm's expected spend is unchanged and it
#   will not use the rest; the report states each arm's actual spend beside H1. A root cannot change once it opens.
#   After 2a, recompute 2b-2c from the measured cost per attempt.
#   [estimate] below is what freeze uses for an arm without priced readings (never a limit).

[workspace]
root = "workspace-claude-v4-support"

[bench]
domains = ["support"]
split_rule = "stratified"       # scored-assertion kinds x tool family, then hashed; the pin below must be reproduced
upstream_path = "~/workspace/AutomationBench"
toolset = "api"
seed = 1                        # the v3 workspace's seed: the same within-stratum order, the same split
concurrency = 8                 # attempts in flight; a machine setting, not part of any plan (M5 §2)
smoke_tasks = 1
near_duplicate_threshold = 0.6
control_readings = 3            # v0.4 (V0_4_PLAN §1.6): W0's dev read 3 times in the baseline, unconditionally

[bench.frozen_splits]           # the split workspace-claude-v3 froze for support (stratified, seed 1), checked by hash
support = "3da11232f5d5ff38"

[bench.ratios]
train = 0.5
dev = 0.25
test = 0.25

[bench.budget]                  # the v3 preset's five hard limits of one attempt (M0 §2), written out
max_steps = 50
max_tool_calls = 200
max_seconds = 900
max_model_calls = 200
max_tokens = 400000

[backends.mock]
type = "mock"

[points]
default_backend = "mock"        # the first version runs no decision model

# The actor W0 pins: Claude Opus 5.5 through headless Claude Code, at effort medium (as claude-v3.toml). K's max_effort
# is lowered to medium too ([harness_evolution] below). Pinned at bootstrap: it cannot change in this workspace.
[llm]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 600

# R: notes, the coding session (up to 40 turns a round).
[research.llm]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 900

# claude-v3.toml's notional prices: claude-opus-5-5's API list prices; max_output_tokens fixes the reservation bound at
# $7.2768.
[pricing]
input_per_1k = 0.004
cache_read_per_1k = 0.0002
cache_write_per_1k = 0.008
output_per_1k = 0.02
max_input_tokens = 1000000
max_output_tokens = 163840
source = "notional, not a bill: claude-opus-5-5 API list price ($4/$20 per M, cache read $0.20, 1h cache write $8), equal to the CLI's reported cost in the probe (docs/ROADMAP.md §3, step 2a), 2026-10-03"

# The v3 preset as of v0.4: package API v2, k = 3 from one coding session, the gate statistics (pooled control, a
# confirmation reading, a regression as a drop over 0.5, the cost term, no gate under 25 tasks), and v0.4's screen
# (6 passing tasks redrawn each round, must-not tasks first; >= 1 fix and <= 1 sample regression) and read floors
# (each candidate grounded by a failed trajectory of its predicted tasks, one passing read a session). freeze writes
# them into K; R cannot raise any of them. A new bootstrap here also gets v0.4's R0 (the session's method text).
[improvement]
mode = "automatic"
preset = "automationbench_harness_v3"
allowed_methods = ["policy_edit", "harness_edit"]
max_candidates_per_round = 3
max_collection_batches = 2      # per worker segment; a restart does not reset it

[harness_evolution]             # the preset's own values, written out (a value here may narrow, never widen)
package_api = "harness_package.v2"
components = ["agent", "memory", "skills", "on_finish", "before_tool", "after_tool", "tools"]
sandbox = "docker"
max_files = 24
max_package_bytes = 262144
test_timeout_seconds = 30
max_draft_repairs = 3           # revisions after the first draft, so at most 4 drafts
max_failure_notes = 30          # notes one round reads, cached and new together (support W0 fails ~27 train tasks)
max_effort = "medium"           # lowered from the preset's high (tighten-only, frozen into K): C1 reads the harness

[harness_evolution.research_session]
max_turns = 40
max_edits = 24
max_trajectory_bytes = 65536
max_trajectory_bytes_total = 524288
min_failing_reads = 1
min_passing_reads = 1

[harness_evolution.screen]
passing_sample = 6
min_net_flips = 0
min_fixes = 1
max_sample_regressions = 1

[rsi]
profile = "task"
scope_id = "support-claude-v4"
stop_view = "stop.business.v1"
repeats = 1
order_seed = 1
# task_plan_ref / schedule_ref / budget_ref: add the lines `ouroloop freeze` prints (before 2a).

# One segment of 3 worker rounds and no research slot. Fewer rounds and slots than the preset plans is allowed
# (bench._beyond_preset refuses only more); the cycle records the slot as deferred. patience 2.
[freeze.schedule]
worker_rounds = 3
research_slots = 0
patience = 2

# The activity's budget in notional dollars at [pricing]: $600, equal to the v0.5 arm's (computed above; equal caps),
# a hard stop fixed when the root opens (2a). The final's share is set aside on the same root from the start.
[freeze.budget]
usd = 600.0

[freeze.budget.final]
usd = 160.0

# Planning numbers for the final's estimate where an arm has no priced reading yet (bench.estimate_settings).
[estimate]
cost_per_attempt = {base = 0.466, evolved = 0.49}

# The final comparison, filled in after the cycle and sealed before any test task is read (M3 §2.2): W0 against W* on
# support's 25 test tasks, repeats 3. The report puts W0's pass@k (k = 1..3) beside W* as the equal-compute reference
# (V0_4_PLAN §1.8). Its plan hash is committed before `--phase evaluate` runs; the result is reported whatever it is.
