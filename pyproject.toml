[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroloop"
version = "0.3.0"
description = "A lightweight RSI framework: an LLM improves a small decision model, and the decision model improves the agent harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The ouroloop Authors" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
keywords = ["agents", "llm", "harness", "decision-model", "self-improvement", "rsi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/e13ven-arch/ouroloop"
Repository = "https://github.com/e13ven-arch/ouroloop"
Issues = "https://github.com/e13ven-arch/ouroloop/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=1.7"]
# What ouroloop's environment needs to run AutomationBench tasks. The benchmark itself is a checkout that
# [bench] upstream_path points at (examples/automationbench/README.md); these are what importing its world, its
# task loader and its tool registry needs. `verifiers` is optional and only widens what the contract check can
# compare against upstream.
automationbench = ["pydantic>=2", "datasets>=2", "openai>=1"]
dev = ["pytest>=8"]
# The training and decision stack (ouroloop/train/, `python -m ouroloop.train`). Its code is in every install and nothing
# on the bench path imports it; this is what it needs besides httpx: huggingface_hub, for an "hf" model store and
# models fetched from the Hub (train/stores/hf.py, train/backends/tde.py). TDE itself, and torch, are a trainer
# plugin's source ([trainers.tde] source): host init installs them on the training machine, and test_tde_compat
# reads a checkout at TDE_REPO.
train = ["huggingface_hub>=0.20"]
# The job layer (ouroloop/train/jobs/): jobs on this machine, on a host over ssh, or on a RunPod or Vast.ai instance.
# It needs ssh, rsync and tar on the control plane and no Python package beyond [train].
train-jobs = ["ouroloop[train]"]

[project.scripts]
ouroloop = "ouroloop.cli:main"

[tool.setuptools.packages.find]
include = ["ouroloop*"]

[tool.setuptools.package-data]
# host init sends bootstrap.sh; images and cloud instances start with start.sh. Keep release.PACKAGE_DATA the same:
# code_version hashes, and host init sends, the modules and these files only.
"ouroloop.train.jobs.hosts" = ["bootstrap.sh", "start.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import the package and the examples from the checkout, and the shared test modules by name wherever they
# live: tests/train/ holds the training stack's tests and their fixtures (decision_fixtures, train_fixtures),
# tests/train/jobs/ the job layer's (jobs_fixtures)
pythonpath = [".", "tests", "tests/train", "tests/train/jobs"]
markers = [
    "live: calls a real external API and needs its key",
    "slow: end-to-end in Docker or against the real upstream checkout (about 90 s); run with -m 'not live' before a paid run or a merge",
]
addopts = "-m 'not live and not slow'"
