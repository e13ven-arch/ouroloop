"store.py" = '''
import json
import os


def load(path):
    """The items of the todo file at path; an empty list when it does not exist yet."""
    if not os.path.exists(path):
        return []
    with open(path) as f:
        return json.load(f)


def save(path, items):
    with open(path, "w") as f:
        json.dump(items, f, indent=1)


def add(path, text):
    """Append an item and return its id; ids start at 1 and are never reused."""
    items = load(path)
    item_id = max((i["id"] for i in items), default=0) + 1
    items.append({"id": item_id, "text": text, "done": False})
    save(path, items)
    return item_id


def mark_done(path, item_id):
    """Mark an item as done; raises KeyError when there is no item with that id."""
    items = load(path)
    for item in items:
        if item["id"] == item_id:
            item["done"] = True
            save(path, items)
            return
    raise KeyError(item_id)
'''
"todo.py" = '''
import argparse
import sys

import store


def main(argv=None):
    parser = argparse.ArgumentParser(description="A tiny todo list.")
    parser.add_argument("--file", default="todo.json", help="where the list is kept")
    sub = parser.add_subparsers(dest="command", required=True)
    p = sub.add_parser("add", help="add an item")
    p.add_argument("text")
    p = sub.add_parser("list", help="show the items")
    p.add_argument("--pending", action="store_true", help="only the items not done yet")
    p = sub.add_parser("done", help="mark an item as done")
    p.add_argument("id", type=int)
    args = parser.parse_args(argv)

    if args.command == "add":
        print(f"added {store.add(args.file, args.text)}")
    elif args.command == "list":
        for item in store.load(args.file):
            if not (args.pending and item["done"]):
                print(f"{item['id']} [{'x' if item['done'] else ' '}] {item['text']}")
    elif args.command == "done":
        try:
            store.mark_done(args.file, args.id)
        except KeyError:
            sys.exit(f"no item {args.id}")


if __name__ == "__main__":
    main()
'''
