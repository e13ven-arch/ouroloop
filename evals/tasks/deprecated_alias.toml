[solution]
"accounts/__init__.py" = '''
from .users import User, display_name, get_user_name

__all__ = ["User", "display_name", "get_user_name"]
'''
"accounts/users.py" = '''
import warnings
from dataclasses import dataclass


@dataclass
class User:
    first: str
    last: str
    nickname: str = ""


def display_name(user):
    """How to show a user: the nickname when there is one, else "First Last"."""
    return user.nickname or f"{user.first} {user.last}"


def get_user_name(user):
    """Deprecated: use display_name."""
    warnings.warn("get_user_name is deprecated, use display_name", DeprecationWarning, stacklevel=2)
    return display_name(user)
'''
"greet.py" = '''
from accounts import display_name


def greet(user):
    return f"Hello, {display_name(user)}!"
'''
"roster.py" = '''
import accounts.users


def roster(users):
    """The users' names, one per line, sorted."""
    return "\n".join(sorted(accounts.users.display_name(u) for u in users))
'''
