<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  </defs>
  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="30" y="34" font-size="22" font-weight="700" fill="#0f172a">Components and architecture</text>
  <text x="30" y="56" font-size="14" fill="#475569">S = (W, R, E; K): the Harness Package a session may change, the Revision Session that changes it, the Host Transcript the session reads, and the Frozen Core that bounds all three</text>

  <!-- ===== Frozen Core (K): four invariants ===== -->
  <rect x="30" y="76" width="1340" height="130" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="50" y="102" font-size="19" font-weight="700" fill="#9f1239">Frozen Core  (K)</text>
  <text x="250" y="102" font-size="14" fill="#9f1239">fixed for the whole loop; R never edits it; everything but W is pinned</text>
  <g fill="#1f2937">
    <rect x="50" y="118" width="310" height="82" rx="8" fill="#ffffff" stroke="#fda4af"/>
    <text x="62" y="138" font-size="14" font-weight="600">Package Contract</text>
    <text x="62" y="155">fixed shape; byte, count and effort limits</text>
    <text x="62" y="171">no answer in the package: the changed lines</text>
    <text x="62" y="187">may carry no value that belongs to one task</text>

    <rect x="420" y="118" width="260" height="82" rx="8" fill="#ffffff" stroke="#fda4af"/>
    <text x="432" y="138" font-size="14" font-weight="600">Host-Side Scorer</text>
    <text x="432" y="155">scores the world a run leaves behind;</text>
    <text x="432" y="171">its grading rows stay on the host;</text>
    <text x="432" y="187">verdict per run: accepted or returned</text>

    <rect x="710" y="118" width="300" height="82" rx="8" fill="#ffffff" stroke="#fda4af"/>
    <text x="722" y="138" font-size="14" font-weight="600">Feedback Tier — the boundary</text>
    <text x="722" y="155">crosses: the verdict; the items tier adds</text>
    <text x="722" y="171">which check failed — its kind and object</text>
    <text x="722" y="187">never: an expected value, a grading row</text>

    <rect x="1030" y="118" width="320" height="82" rx="8" fill="#ffffff" stroke="#fda4af"/>
    <text x="1042" y="138" font-size="14" font-weight="600">Bounds</text>
    <text x="1042" y="155">probes per task, steps, tokens, time, money:</text>
    <text x="1042" y="171">fixed for the loop; no session can raise them</text>
  </g>
  <line x1="680" y1="159" x2="710" y2="159" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#ar)"/>

  <!-- ===== Harness Package (W) ===== -->
  <rect x="30" y="246" width="310" height="510" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="50" y="274" font-size="19" font-weight="700" fill="#14532d">Harness Package  (W)</text>
  <text x="50" y="294" fill="#14532d">the only thing R may change; one fixed shape</text>
  <g fill="#1f2937">
    <rect x="50" y="308" width="270" height="32" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="329"><tspan font-weight="600">W₀</tspan> — the base package</text>

    <rect x="50" y="352" width="270" height="30" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="372"><tspan font-weight="600">Agent Loop</tspan> — fixed; it runs the package</text>
    <rect x="50" y="390" width="270" height="30" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="410"><tspan font-weight="600">Tools</tspan> — written by R; every call lands on E</text>
    <rect x="50" y="428" width="270" height="46" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="448"><tspan font-weight="600">Hooks · six sites</tspan> — around the model</text>
    <text x="62" y="465">call and the tool call, after a turn, on finish</text>
    <rect x="50" y="482" width="270" height="30" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="502"><tspan font-weight="600">Prompts · Skills</tspan> — text may only grow</text>
    <rect x="50" y="520" width="270" height="30" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="540"><tspan font-weight="600">Config</tspan> — knobs within K's ranges</text>
    <rect x="50" y="558" width="270" height="30" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="578"><tspan font-weight="600">Manifest</tspan> — the contract; must equal the diff</text>

    <rect x="50" y="598" width="270" height="58" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="62" y="618" fill="#14532d"><tspan font-weight="600">Guard</tspan> — one hook kind, as an example:</text>
    <text x="62" y="634" fill="#14532d">blocks one call once, states its reasons,</text>
    <text x="62" y="650" fill="#14532d">lets the same call through when resent</text>

    <rect x="58" y="668" width="262" height="56" rx="8" fill="#ffffff" stroke="#86efac"/>
    <rect x="50" y="676" width="270" height="56" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="62" y="697"><tspan font-weight="600">W_t</tspan> — one per task:</text>
    <text x="62" y="715">the adopted package, else W₀</text>
  </g>

  <!-- ===== Isolated Worker: a boundary, not a component ===== -->
  <rect x="400" y="246" width="320" height="510" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="420" y="274" font-size="19" font-weight="700" fill="#0f172a">Isolated Worker</text>
  <text x="420" y="294" fill="#334155">one run = the request on a fresh world copy;</text>
  <text x="420" y="311" fill="#334155">runs W_t or a candidate W′; pinned by K</text>
  <g fill="#1f2937">
    <rect x="420" y="324" width="280" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="432" y="344" font-size="14" font-weight="600">Sandbox</text>
    <text x="432" y="361">isolated from the host and the network;</text>
    <text x="432" y="378">hard limits on steps, tokens and time</text>

    <rect x="420" y="400" width="280" height="98" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="432" y="420" font-size="14" font-weight="600">Host Transcript  (E)</text>
    <text x="432" y="437">written by the host: every model call,</text>
    <text x="432" y="454">tool call, hook decision and write;</text>
    <text x="432" y="471">the package may only append lines</text>
    <text x="432" y="488">marked as its own</text>

    <rect x="420" y="510" width="280" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="432" y="530" font-size="14" font-weight="600">Two paths out, both on E</text>
    <text x="432" y="547">one to the model, one to the business tools;</text>
    <text x="432" y="564">hooks see the world read-only</text>
  </g>
  <g fill="#1f2937">
    <rect x="420" y="586" width="280" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="432" y="606" font-size="14" font-weight="600">In</text>
    <text x="432" y="623">the request, from the protocol; W_t — or W′</text>
    <rect x="420" y="646" width="280" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="432" y="666" font-size="14" font-weight="600">Out</text>
    <text x="432" y="683">the world after the run → scorer; E → R</text>
  </g>

  <!-- ===== Revision Session (R) ===== -->
  <rect x="780" y="246" width="560" height="510" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="800" y="274" font-size="19" font-weight="700" fill="#1e3a8a">Revision Session  (R)</text>
  <text x="800" y="294" fill="#1e3a8a">one bounded coding session</text>
  <text x="800" y="311" fill="#1e3a8a">per returned request; edits a copy</text>
  <text x="800" y="328" fill="#1e3a8a">of W_t and must prove the change live</text>
  <g fill="#1f2937">
    <text x="800" y="352" font-weight="600" fill="#1e3a8a">What it is told</text>
    <rect x="800" y="360" width="252" height="62" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="812" y="380" font-size="14" font-weight="600">Acceptance Signal</text>
    <text x="812" y="397">accepted or returned, once per run;</text>
    <text x="812" y="414">at every tier</text>
    <rect x="1068" y="360" width="252" height="62" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="1080" y="380" font-size="14" font-weight="600">Rejected Checks</text>
    <text x="1080" y="397">items tier: which message, row or</text>
    <text x="1080" y="414">record failed — never its value</text>
    <rect x="800" y="430" width="252" height="62" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="812" y="450" font-size="14" font-weight="600">Run Digest</text>
    <text x="812" y="467">E as the session sees it: calls, hooks,</text>
    <text x="812" y="484">writes, the final text; no score</text>
    <rect x="1068" y="430" width="252" height="62" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="1080" y="450" font-size="14" font-weight="600">Source Inventory</text>
    <text x="1080" y="467">the world's sources as counts:</text>
    <text x="1080" y="484">read, or never read</text>

    <text x="800" y="518" font-weight="600" fill="#1e3a8a">What it must pass</text>
    <rect x="800" y="526" width="244" height="78" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="812" y="546" font-size="14" font-weight="600">Candidate  W′ = W_t + diff</text>
    <text x="812" y="563">what the session edited, taken</text>
    <text x="812" y="580">as the diff, never as its claim</text>
    <rect x="1076" y="526" width="244" height="78" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="1088" y="546" font-size="14" font-weight="600">Admissible? — by the host</text>
    <text x="1088" y="563">deterministic, no model asked:</text>
    <text x="1088" y="580">within the Package Contract;</text>
    <text x="1088" y="597">no literal of one task; changed</text>
    <text x="1076" y="620" font-size="11" fill="#6b7280">fails → back to the session, no probe</text>

    <rect x="800" y="630" width="520" height="64" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="812" y="650"><tspan font-size="14" font-weight="600">Live Probe</tspan> — W′ runs the same request for real, in the worker</text>
    <text x="812" y="667">probes are bounded; the same tree is never probed twice:</text>
    <text x="812" y="684">each verdict is evidence about one change</text>

    <rect x="800" y="704" width="520" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="812" y="723"><tspan font-size="14" font-weight="600">Experience Library</tspan> — every adopted tree with its lesson, read first</text>
    <text x="812" y="740">written by adoption, never by the session; the only channel between tasks</text>
  </g>
  <line x1="1044" y1="565" x2="1076" y2="565" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1300" y1="604" x2="1300" y2="630" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1308" y="621" font-size="11" fill="#334155">pass</text>

  <!-- ===== host decision ===== -->
  <rect x="360" y="786" width="1010" height="80" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="380" y="812" font-size="15" font-weight="700" fill="#14532d">Per-Task Adoption — applied by the host</text>
  <text x="380" y="832" fill="#14532d">the last candidate whose probe was accepted, as it ran, becomes W_t — the bytes that ran are the bytes adopted;</text>
  <text x="380" y="850" fill="#14532d">none accepted within the probe bound, W_t stays. No judge model, no person, no expected value. Encounter 1 accepted: finished, W_t never revised.</text>

  <!-- ===== edges ===== -->
  <!-- K -> W, K -> R -->
  <path d="M 185 206 L 185 246" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ad)"/>
  <text x="195" y="230" font-size="12" fill="#64748b">the Package Contract</text>
  <path d="M 1320 206 L 1320 246" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ad)"/>
  <text x="1310" y="230" font-size="12" fill="#64748b" text-anchor="end">tier, bounds</text>
  <!-- the world after the run -> scorer -->
  <path d="M 560 246 L 560 206" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="572" y="230" font-size="12" fill="#334155">the world after the run</text>
  <!-- tier -> R: the one boundary crossing -->
  <path d="M 990 200 L 990 226 L 1060 226 L 1060 360" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#ar)"/>
  <path d="M 1060 262 L 1240 262" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="1243" cy="262" r="3.5" fill="#94a3b8"/>
  <text x="1068" y="257" font-size="11" fill="#64748b">accepted at encounter 1 → finished, W_t never revised</text>
  <text x="1068" y="283" font-size="11" fill="#b91c1c">returned → the session opens</text>
  <!-- scorer -> adoption rule -->
  <path d="M 440 200 L 440 226 L 370 226 L 370 786" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#ar)"/>
  <text x="383" y="520" font-size="11" fill="#b91c1c" text-anchor="middle" transform="rotate(-90 383 520)">verdict, every run → the adoption rule</text>
  <!-- W_t -> worker (jumps the verdict line) -->
  <rect x="363" y="697" width="14" height="14" fill="#ffffff"/>
  <line x1="320" y1="704" x2="400" y2="704" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="392" y="698" font-size="11" fill="#334155" text-anchor="end">W_t</text>
  <!-- E -> R -->
  <line x1="700" y1="449" x2="780" y2="449" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="740" y="442" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">E</text>
  <!-- probe: R -> worker -->
  <line x1="800" y1="666" x2="720" y2="666" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ad)"/>
  <text x="760" y="659" font-size="11" fill="#64748b" text-anchor="middle">probe</text>
  <!-- adoption -> W_t, library -->
  <path d="M 360 806 L 185 806 L 185 732" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <text x="272" y="800" font-size="12" fill="#15803d" text-anchor="middle">accepted → W_t := W′</text>
  <text x="272" y="822" font-size="12" fill="#64748b" text-anchor="middle">none accepted → W_t stays</text>
  <path d="M 1200 786 L 1200 748" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ad)"/>
  <text x="1208" y="772" font-size="11" fill="#64748b">tree + lesson</text>

  <!-- ===== invariants ===== -->
  <g fill="#1f2937">
    <rect x="30" y="890" width="256" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="42" y="909" font-weight="600">I1  only W changes</text>
    <text x="42" y="926" font-size="11" fill="#6b7280">the Frozen Core pins the rest</text>
    <rect x="301" y="890" width="256" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="313" y="909" font-weight="600">I2  R never sees a value</text>
    <text x="313" y="926" font-size="11" fill="#6b7280">the Feedback Tier in; the Contract out</text>
    <rect x="572" y="890" width="256" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="584" y="909" font-weight="600">I3  an accepted task opens no session</text>
    <text x="584" y="926" font-size="11" fill="#6b7280">the host rule at encounter 1</text>
    <rect x="843" y="890" width="256" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="855" y="909" font-weight="600">I4  adoption binds to one task</text>
    <text x="855" y="926" font-size="11" fill="#6b7280">W_t; the green edge</text>
    <rect x="1114" y="890" width="256" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1126" y="909" font-weight="600">I5  tasks meet only through the library</text>
    <text x="1126" y="926" font-size="11" fill="#6b7280">the Experience Library</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="12" fill="#475569">
    <rect x="30" y="954" width="12" height="12" fill="#fff1f2" stroke="#fda4af"/><text x="48" y="964">K, fixed</text>
    <rect x="120" y="954" width="12" height="12" fill="#f0fdf4" stroke="#86efac"/><text x="138" y="964">W and adoption</text>
    <rect x="250" y="954" width="12" height="12" fill="#eff6ff" stroke="#93c5fd"/><text x="268" y="964">R, the session</text>
    <rect x="375" y="954" width="12" height="12" fill="#f8fafc" stroke="#64748b" stroke-dasharray="3 2"/><text x="393" y="964">the worker boundary</text>
    <line x1="540" y1="960" x2="572" y2="960" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 5"/><text x="580" y="964">a verdict</text>
    <line x1="660" y1="960" x2="692" y2="960" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/><text x="700" y="964">per probe</text>
    <line x1="780" y1="960" x2="812" y2="960" stroke="#334155" stroke-width="1.5"/><text x="820" y="964">a run's artefacts: the world, E</text>
  </g>
</svg>
