# finance-v1: the first measured activity under the forward design (docs/PLAN.md stage 4, docs/DESIGN.md §10). Finance on
# the stratified split v0.4 read (pinned below), the automationbench_v1 preset, the stirrup seed, a $450 nominal root
# with $160 set aside for the final. Every paid step is approved in chat first (PLAN rule 3).
#
# Not runnable yet: [memory] enabled needs the memory package (stage 2) and the rounds need the improver (stage 3); the
# startup checks refuse until they are in place. The order then is:
#   1  `ouroloop bench --config examples/automationbench/finance-v1.toml --phase smoke --checks-only`              $0
#   2  `ouroloop freeze --config ...`: K, the gate template and the budget root; add the printed [rsi] lines       $0
#   3  `... --phase cycle --until baseline`, then `--until library`, then `--until round-0`, round-1, round-2
#   4  after an install: `ouroloop freeze --config ...` again seals the final plan (the [final] table below) and prints
#      final_plan_ref; its hash is committed to git before the first test attempt (PLAN rule 6); then
#      `... --phase evaluate`
#
# The numbers are the preset's (activity/presets.py, from evidence); a value here may only tighten one.

[workspace]
root = "workspace-finance-v1"

[bench]
domain = "finance"
upstream_path = "~/workspace/AutomationBench"
split_rule = "stratified"
seed = 1
concurrency = 8

[bench.frozen_splits]
finance = "4fd91eaf9fb8daf5"

[model]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 600

[research_model]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 900

[pricing]
input_per_1k = 0.004
cache_read_per_1k = 0.0002
cache_write_per_1k = 0.008
output_per_1k = 0.02
max_input_tokens = 1000000
max_output_tokens = 163840
source = "notional, not a bill: claude-opus-5-5 API list price ($4/$20 per M, cache read $0.20, 1h cache write $8)"

[harness]
preset = "automationbench_v1"
seed = "stirrup"

[worker]
network = "none"

[memory]
enabled = true

[improver]
k = 3

[schedule]
rounds = 3
patience = 2

[budget]
usd = 450.0
final_usd = 160.0

[final]
repeats = 3

[rsi]
scope_id = "finance-v1"
# core_ref / split_ref / final_plan_ref: the lines `ouroloop freeze` prints.
