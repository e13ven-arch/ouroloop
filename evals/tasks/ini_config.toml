"test_hidden.py" = '''
import unittest

from inifile import ParseError, dumps, loads


class T(unittest.TestCase):
    def test_loads_sections(self):
        text = """; settings for the demo
Name = demo

  [ Paths ]
# the root
root = /srv
[server]
host = example.org
    debug=true
[Paths]
ROOT = /var/srv
cache = /tmp
[unused]
"""
        self.assertEqual(loads(text), {"": {"name": "demo"}, "Paths": {"root": "/var/srv", "cache": "/tmp"},
                                       "server": {"host": "example.org", "debug": "true"}, "unused": {}})
        self.assertEqual(loads("[a]\nx = 1\n"), {"a": {"x": "1"}})

    def test_loads_values(self):
        text = """[v]
url = http://example.org/?a=1&b=2
motto = "  stay  calm  "
quoted = ""
note = 1 # not a comment
semi = a; b
empty =
tabs =\tspaced out\t
"""
        self.assertEqual(loads(text)["v"], {"url": "http://example.org/?a=1&b=2", "motto": "  stay  calm  ",
                                            "quoted": "", "note": "1 # not a comment", "semi": "a; b", "empty": "",
                                            "tabs": "spaced out"})

    def test_parse_error(self):
        self.assertTrue(issubclass(ParseError, ValueError))
        cases = [("[a]\nx = 1\n\n# fine\nnot a setting\n", 5), ("x = 1\n[broken\n", 2), ("  = value\n", 1)]
        for text, lineno in cases:
            with self.assertRaises(ParseError, msg=text) as caught:
                loads(text)
            self.assertEqual(caught.exception.lineno, lineno, text)

    def test_dumps(self):
        data = {"db": {"host": "localhost", "port": "5432"}, "": {"name": "demo"}, "empty": {}}
        self.assertEqual(dumps(data), "name = demo\n\n[db]\nhost = localhost\nport = 5432\n\n[empty]\n")
        self.assertEqual(dumps({}), "")

    def test_round_trip(self):
        data = {"": {"top": "1"}, "odd values": {"padded": "  two sides ", "quoted": '"already"', "half": '"open',
                                                 "equals": "a = b", "hash": "x # y", "empty": "", "tab": "\tlead"},
                "Mixed Case": {"k": "v"}}
        self.assertEqual(loads(dumps(data)), data)
'''

[solution]
"inifile.py" = '''
class ParseError(ValueError):
    def __init__(self, lineno, line):
        super().__init__(f"line {lineno}: cannot parse {line!r}")
        self.lineno = lineno


def loads(text):
    data, section = {}, ""
    for lineno, raw in enumerate(text.splitlines(), 1):
        line = raw.strip()
        if not line or line[0] in "#;":
            continue
        if line.startswith("[") and line.endswith("]"):
            section = line[1:-1].strip()
            data.setdefault(section, {})
            continue
        key, eq, value = line.partition("=")
        key, value = key.strip().lower(), value.strip()
        if not eq or not key:
            raise ParseError(lineno, raw)
        if len(value) >= 2 and value[0] == value[-1] == '"':
            value = value[1:-1]
        data.setdefault(section, {})[key] = value
    return data


def _value(value):
    return f'"{value}"' if value != value.strip() or value.startswith('"') else value


def dumps(data):
    blocks = []
    for name, section in sorted(data.items(), key=lambda item: item[0] != ""):  # the "" section first
        lines = [] if name == "" else [f"[{name}]"]
        lines += [f"{key} = {_value(value)}" for key, value in section.items()]
        if lines:
            blocks.append("\n".join(lines))
    return "\n\n".join(blocks) + "\n" if blocks else ""
'''
