    "python3 -m unittest -q test_hidden.T.test_last_page",
    "python3 -m unittest -q test_hidden.T.test_invalid_page",
    "python3 -m unittest -q test_hidden.T.test_page_count_unchanged",
]

[files]
"pagination.py" = '''
def paginate(items, page, per_page=10):
    """The items on the given page. Pages are numbered from 1."""
    start = page * per_page
    return items[start:start + per_page]


def page_count(n_items, per_page=10):
    return (n_items + per_page - 1) // per_page
