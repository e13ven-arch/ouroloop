[solution]
"leaderboard.py" = '''
def rank(scores):
    """scores maps player name to points. Rows of (position, name, points), most points first. Players with equal
    points share a position and are listed by name, and the next position skips the shared places: 100, 90, 90, 80
    get positions 1, 2, 2, 4."""
    rows = sorted(scores.items(), key=lambda kv: (-kv[1], kv[0]))
    out = []
    for i, (name, points) in enumerate(rows, 1):
        position = out[-1][0] if out and out[-1][2] == points else i
        out.append((position, name, points))
    return out


def top(scores, n):
    """The rows of rank() with position n or better, so players tied for a place are never split."""
    return [row for row in rank(scores) if row[0] <= n]


def queue(jobs):
    """jobs is a list of (priority, name) pairs. The job names, lowest priority number first; jobs with equal priority
    keep the order they have in jobs."""
    return [name for _, name in sorted(jobs, key=lambda job: job[0])]
'''
