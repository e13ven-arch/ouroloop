<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="30" y="34" font-size="22" font-weight="700" fill="#0f172a">Components and architecture</text>
  <text x="30" y="56" fill="#475569">S = (W, R, E; K): the Harness Package the improver may change, the Revision Session that changes it, the Host Transcript it is judged from, and the Frozen Core that bounds all three</text>

  <!-- ===== Frozen Core (K) ===== -->
  <rect x="30" y="80" width="1340" height="140" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="50" y="108" font-size="19" font-weight="700" fill="#9f1239">Frozen Core  (K)</text>
  <text x="240" y="108" fill="#9f1239">a preset a config may only tighten; nothing here is open to the improver</text>
  <g font-size="14" fill="#1f2937">
    <rect x="50" y="126" width="252" height="78" rx="8" fill="#ffffff" stroke="#fda4af"/>
    <text x="62" y="148" font-weight="600">Sealed Protocol</text>
    <text x="62" y="168">tasks · encounters · feedback tier</text>
    <text x="62" y="186" fill="#6b7280">sealed before the first test attempt</text>
    <rect x="312" y="126" width="252" height="78" rx="8" fill="#ffffff" stroke="#fda4af"/>
    <text x="324" y="148" font-weight="600">Family Split</text>
    <text x="324" y="168">per task family, assigned by hash</text>
    <text x="324" y="186" fill="#6b7280">a test read ends development</text>
    <rect x="574" y="126" width="252" height="78" rx="8" fill="#ffffff" stroke="#fda4af"/>
    <text x="586" y="148" font-weight="600">Budget Guard</text>
    <text x="586" y="168">reserve worst case → call → settle</text>
    <text x="586" y="186" fill="#6b7280">above its bound: the scope stops</text>
    <rect x="836" y="126" width="252" height="78" rx="8" fill="#ffffff" stroke="#fda4af"/>
    <text x="848" y="148" font-weight="600">Integrity Pins</text>
    <text x="848" y="168">worker image id · code hashes · CLI</text>
    <text x="848" y="186" fill="#6b7280">checked before every phase</text>
    <rect x="1098" y="126" width="252" height="78" rx="8" fill="#ffffff" stroke="#fda4af"/>
    <text x="1110" y="148" font-weight="600">Host-Side Scorer</text>
    <text x="1110" y="168">the scorer and its grading rows</text>
    <text x="1110" y="186" fill="#6b7280">never in the improver's inputs</text>
  </g>

  <!-- ===== Harness Package (W) ===== -->
  <rect x="30" y="250" width="400" height="530" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="50" y="278" font-size="19" font-weight="700" fill="#14532d">Harness Package  (W)</text>
  <text x="50" y="298" font-size="14" fill="#14532d">the only thing the improver may change;</text>
  <text x="50" y="316" font-size="14" fill="#14532d">fixed shape, every file content-addressed</text>
  <g font-size="14" fill="#1f2937">
    <rect x="50" y="332" width="360" height="56" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="353" font-weight="600">Agent Loop</text>
    <text x="62" y="373">the vendored seed behind one adapter</text>
    <rect x="50" y="398" width="175" height="94" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="419" font-weight="600">Tools</text>
    <text x="62" y="439">the seed ships one, and</text>
    <text x="62" y="457">it writes nothing; every</text>
    <text x="62" y="475">other tool is R's</text>
    <rect x="235" y="398" width="175" height="94" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="247" y="419" font-weight="600">Hooks · six sites</text>
    <text x="247" y="439">before/after model,</text>
    <text x="247" y="457">before/after tool,</text>
    <text x="247" y="475">after turn, on finish</text>
    <rect x="50" y="502" width="175" height="94" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="523" font-weight="600">Prompts · Skills</text>
    <text x="62" y="543">existing text may only</text>
    <text x="62" y="561">grow; a skill loads</text>
    <text x="62" y="579">on its trigger</text>
    <rect x="235" y="502" width="175" height="94" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="247" y="523" font-weight="600">Config · Tests</text>
    <text x="247" y="543">knobs inside K's ranges;</text>
    <text x="247" y="561">the package's own tests</text>
    <rect x="50" y="606" width="360" height="56" rx="8" fill="#ffffff" stroke="#86efac"/>
    <text x="62" y="627" font-weight="600">Manifest</text>
    <text x="62" y="647">registers tools, hooks, skills; checked for shape</text>
    <rect x="50" y="672" width="360" height="90" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="62" y="693" font-weight="600" fill="#14532d">Guards, the improver's usual build</text>
    <text x="62" y="713">a before-tool hook that blocks one call once,</text>
    <text x="62" y="731">states its reasons, and lets the same call</text>
    <text x="62" y="749">through when the agent sends it again</text>
  </g>

  <!-- ===== Isolated Worker ===== -->
  <rect x="460" y="250" width="400" height="530" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="480" y="278" font-size="19" font-weight="700" fill="#0f172a">Isolated Worker</text>
  <text x="480" y="298" font-size="14" fill="#334155">package code never runs in the control process;</text>
  <text x="480" y="316" font-size="14" fill="#334155">every encounter and every probe runs here</text>
  <g font-size="14" fill="#1f2937">
    <rect x="480" y="332" width="360" height="108" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="492" y="353" font-weight="600">Container pinned by image id</text>
    <text x="492" y="373">no network · read-only root · unprivileged user</text>
    <text x="492" y="391">a standard-library runner, its sha256 checked</text>
    <text x="492" y="409">on every load; effort capped at the ceiling;</text>
    <text x="492" y="427">hard limits on calls, tokens, steps and time</text>
    <rect x="480" y="450" width="360" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="492" y="471" font-weight="600">Host Transcript  (E)</text>
    <text x="492" y="491">every model call, tool call, hook decision,</text>
    <text x="492" y="509">write and mark, written by the host; the</text>
    <text x="492" y="527">package may only append lines marked as its own</text>
    <text x="492" y="545">failures typed: defect · infrastructure · limit</text>
    <rect x="480" y="570" width="360" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="492" y="591" font-weight="600">Metered Gateway  → the model</text>
    <text x="492" y="611">every call reserved at its worst case first,</text>
    <text x="492" y="629">settled after; roles declared, effort capped</text>
    <rect x="480" y="660" width="360" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="492" y="681" font-weight="600">World Broker  → the business tools</text>
    <text x="492" y="701">one path to the world, with a deny table;</text>
    <text x="492" y="719">hooks receive it read-only; every call</text>
    <text x="492" y="737">the agent makes lands in the transcript</text>
  </g>

  <!-- ===== Revision Session (R) ===== -->
  <rect x="890" y="250" width="480" height="530" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="910" y="278" font-size="19" font-weight="700" fill="#1e3a8a">Revision Session  (R)</text>
  <text x="910" y="298" font-size="14" fill="#1e3a8a">one bounded coding session per returned request;</text>
  <text x="910" y="316" font-size="14" fill="#1e3a8a">it edits a copy of the package and must prove it live</text>
  <g font-size="14" fill="#1f2937">
    <text x="910" y="344" font-weight="600" fill="#1e3a8a">What it is told</text>
    <rect x="910" y="352" width="215" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="922" y="372" font-weight="600">Acceptance Signal</text>
    <text x="922" y="391">accepted or returned,</text>
    <text x="922" y="409">once per attempt</text>
    <rect x="1135" y="352" width="215" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="1147" y="372" font-weight="600">Rejected Checks</text>
    <text x="1147" y="391">which message, row or record</text>
    <text x="1147" y="409">failed, never the value</text>
    <rect x="910" y="432" width="215" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="922" y="452" font-weight="600">Run Digest</text>
    <text x="922" y="471">calls, hooks, writes, the</text>
    <text x="922" y="489">final text; no score</text>
    <rect x="1135" y="432" width="215" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="1147" y="452" font-weight="600">Source Inventory</text>
    <text x="1147" y="471">the world's sources as</text>
    <text x="1147" y="489">counts: read, or never</text>
    <rect x="910" y="512" width="440" height="36" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="922" y="535" font-weight="600">Experience Library <tspan font-weight="400">— every adopted tree with its lesson</tspan></text>

    <text x="910" y="574" font-weight="600" fill="#1e3a8a">What it must pass</text>
    <rect x="910" y="582" width="215" height="90" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="922" y="602" font-weight="600">Live Probe</text>
    <text x="922" y="621">runs the candidate on the same</text>
    <text x="922" y="639">request, in the worker; at</text>
    <text x="922" y="657">most four probes per task</text>
    <rect x="1135" y="582" width="215" height="90" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="1147" y="602" font-weight="600">Preflight Checks</text>
    <text x="1147" y="621">shape · one-task literal scan</text>
    <text x="1147" y="639">package tests · a smoke run</text>
    <text x="1147" y="657" fill="#6b7280">all at no cost</text>
    <rect x="910" y="682" width="440" height="84" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="922" y="703" font-weight="600" fill="#14532d">Per-Task Adoption</text>
    <text x="922" y="722">the last candidate whose probe came back accepted</text>
    <text x="922" y="740">becomes this task's harness; none accepted, the base</text>
    <text x="922" y="758">stays. No judge model, no person, no expected value.</text>
  </g>

  <!-- ===== arrows ===== -->
  <line x1="430" y1="360" x2="460" y2="360" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="860" y1="468" x2="910" y2="468" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="885" y="460" text-anchor="middle" fill="#334155" font-size="12">digest</text>
  <line x1="910" y1="627" x2="860" y2="627" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ad)"/>
  <text x="885" y="619" text-anchor="middle" fill="#64748b" font-size="12">probe</text>
  <path d="M 1224 204 L 1224 228 L 1300 228 L 1300 352" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#ar)"/>
  <text x="1290" y="244" text-anchor="end" fill="#b91c1c" font-size="12">the verdict, and which checks failed — never an expected value</text>
  <path d="M 1130 766 L 1130 802 L 230 802 L 230 780" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <text x="680" y="793" text-anchor="middle" fill="#15803d" font-size="13">adopted for this task only: the task's own Harness Package on its later encounters</text>
  <path d="M 230 220 L 230 250" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ad)"/>
  <path d="M 660 220 L 660 250" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ad)"/>
</svg>
