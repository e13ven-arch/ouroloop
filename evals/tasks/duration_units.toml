[solution]
"durations.py" = '''
import re

UNITS = {"h": 3600, "m": 60, "s": 1}


def parse_duration(text):
    """The number of seconds in a duration such as "1h30m"."""
    m = re.fullmatch(r"(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?", text.replace(" ", "").lower())
    if not m or not any(m.groups()):
        raise ValueError(f"not a duration: {text!r}")
    return sum(int(n) * size for n, size in zip(m.groups(), UNITS.values()) if n)


def format_duration(seconds):
    """The inverse of parse_duration: 5400 -> "1h30m"; parts that are zero are left out."""
    parts = []
    for unit, size in UNITS.items():
        n, seconds = divmod(seconds, size)
        if n:
            parts.append(f"{n}{unit}")
    return "".join(parts) or "0s"
'''
