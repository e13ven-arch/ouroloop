import importlib.util
import subprocess
import sys
import unittest


class T(unittest.TestCase):
    def test_runs(self):
        out = subprocess.run([sys.executable, "app.py"], capture_output=True, text=True, timeout=30)
        self.assertEqual(out.returncode, 0, out.stderr)
        self.assertEqual(out.stdout.splitlines(), ["Lovelace, Ada", "Turing, Alan"])

    def test_function_stays(self):
        from utils.names import format_name
        self.assertEqual(format_name("grace", "hopper"), "Hopper, Grace")

    def test_no_helpers_module(self):
        self.assertIsNone(importlib.util.find_spec("helpers"))
'''

[solution]
"app.py" = '''
from utils.names import format_name


def main():
    for first, last in [("ada", "lovelace"), ("alan", "turing")]:
        print(format_name(first, last))


if __name__ == "__main__":
    main()
'''
