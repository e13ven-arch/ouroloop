import unittest
import warnings

import accounts
from accounts.users import User


class T(unittest.TestCase):
    def test_new_name(self):
        from accounts import display_name
        from accounts.users import display_name as same
        self.assertIs(display_name, same)
        self.assertIn("display_name", accounts.__all__)
        with warnings.catch_warnings():
