"test_hidden.py" = '''
import csv
import os
import subprocess
import sys
import tempfile
import unittest

HEADER = ["name", "email", "phone"]


def clean(text):
    with tempfile.TemporaryDirectory() as d:
        src, dst = os.path.join(d, "in.csv"), os.path.join(d, "out.csv")
        with open(src, "w", newline="") as f:
            f.write(text)
        subprocess.run([sys.executable, "clean_contacts.py", src, dst], check=True, capture_output=True, timeout=30)
        with open(dst, newline="") as f:
            return list(csv.reader(f))


class T(unittest.TestCase):
    def test_strip(self):
        self.assertEqual(clean("name,email,phone\n Ann Lee , ann@x.org ,  5550100\n"),
                         [HEADER, ["Ann Lee", "ann@x.org", "5550100"]])

    def test_email_lowercase(self):
        self.assertEqual(clean("name,email,phone\nBo,Bo@X.ORG,1\nCy,cy@Y.org,2\n"),
                         [HEADER, ["Bo", "bo@x.org", "1"], ["Cy", "cy@y.org", "2"]])

    def test_missing_email_dropped(self):
        self.assertEqual(clean("name,email,phone\nAnn,,1\nBo,bo@x.org,2\nCy,,3\n"),
                         [HEADER, ["Bo", "bo@x.org", "2"]])

    def test_duplicate_email_dropped(self):
        self.assertEqual(clean("name,email,phone\nAnn,ann@x.org,1\nBo,bo@x.org,2\nAnnie,ann@x.org,3\nA.,ANN@x.org,4\n"),
                         [HEADER, ["Ann", "ann@x.org", "1"], ["Bo", "bo@x.org", "2"]])

    def test_phone_digits(self):
        text = "name,email,phone\nAnn,ann@x.org,+1 (555) 010-2030\nBo,bo@x.org,555.010.4455\nCy,cy@x.org,\n"
        self.assertEqual(clean(text), [HEADER, ["Ann", "ann@x.org", "15550102030"], ["Bo", "bo@x.org", "5550104455"],
                                       ["Cy", "cy@x.org", ""]])
