[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroloop"
version = "0.1.0"
description = "A lightweight RSI framework: an LLM improves a small decision model, and the decision model improves the agent harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The ouroloop Authors" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
keywords = ["agents", "llm", "harness", "decision-model", "self-improvement", "rsi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/e13ven-arch/ouroloop"
Repository = "https://github.com/e13ven-arch/ouroloop"
Issues = "https://github.com/e13ven-arch/ouroloop/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=1.7"]
dev = ["pytest>=8"]

[project.scripts]
ouroloop = "ouroloop.cli:main"

[tool.setuptools.packages.find]
include = ["ouroloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real external API and needs its key"]
addopts = "-m 'not live'"
