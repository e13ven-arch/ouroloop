"test_hidden.py" = '''
import unittest

from stock import Stock

BAD_QTY = "quantity must be a positive integer"


def stocked():
    s = Stock()
    s.add("pear", 3)
    s.add("apple", 2)
    return s


class T(unittest.TestCase):
    def test_add_validation(self):
        s = stocked()
        for qty in (0, -2, 1.5):
            with self.assertRaises(ValueError) as cm:
                s.add("fig", qty)
            self.assertEqual(str(cm.exception), BAD_QTY)
        self.assertEqual(s.count("fig"), 0)

    def test_remove(self):
        s = stocked()
        s.remove("pear", 1)
        s.remove("apple", 2)
        self.assertEqual((s.count("pear"), s.count("apple")), (2, 0))

    def test_remove_errors(self):
        s = stocked()
        with self.assertRaises(KeyError) as cm:
            s.remove("fig", 1)
        self.assertEqual(cm.exception.args, ("fig",))
        with self.assertRaises(ValueError) as cm:
            s.remove("apple", 5)
        self.assertEqual(str(cm.exception), "only 2 apple in stock")
        with self.assertRaises(ValueError) as cm:
            s.remove("pear", 0)
        self.assertEqual(str(cm.exception), BAD_QTY)
        self.assertEqual((s.count("pear"), s.count("apple")), (3, 2))

    def test_items_and_total(self):
        s = stocked()
        s.add("fig", 1)
        s.remove("pear", 3)
        self.assertEqual(s.items(), [("apple", 2), ("fig", 1)])
        self.assertEqual(s.total(), 3)
'''

[solution]
"stock.py" = '''
class Stock:
    """Counts of the items in stock, by name."""

    def __init__(self):
        self.counts = {}

    def add(self, name, qty):
        _check_qty(qty)
        self.counts[name] = self.counts.get(name, 0) + qty

    def remove(self, name, qty):
        _check_qty(qty)
        if name not in self.counts:
            raise KeyError(name)
        have = self.counts[name]
        if have < qty:
            raise ValueError(f"only {have} {name} in stock")
        if have == qty:
            del self.counts[name]
        else:
            self.counts[name] = have - qty

    def count(self, name):
        return self.counts.get(name, 0)

    def items(self):
        return sorted(self.counts.items())

    def total(self):
        return sum(self.counts.values())


def _check_qty(qty):
    if not isinstance(qty, int) or qty < 1:
        raise ValueError("quantity must be a positive integer")
'''
