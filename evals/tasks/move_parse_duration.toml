[solution]
"durations.py" = '''
import re

_UNITS = {"d": 86400, "h": 3600, "m": 60, "s": 1}


def parse_duration(text):
    """Seconds in a duration such as "1h30m", "45s" or "2d"; raises ValueError for anything else."""
    parts = re.findall(r"(\d+)([dhms])", text)
    if not parts or "".join(n + u for n, u in parts) != text.strip():
        raise ValueError(f"not a duration: {text!r}")
    return sum(int(n) * _UNITS[u] for n, u in parts)
'''
"utils.py" = '''
def clamp(x, lo, hi):
    return max(lo, min(x, hi))


def plural(n, word):
    return f"{n} {word}" if n == 1 else f"{n} {word}s"
'''
"scheduler.py" = '''
from durations import parse_duration
from utils import clamp


def next_run(last, every, min_gap=60):
    """When (in seconds) to run next after last, for an interval such as "15m"; never sooner than min_gap."""
    return last + clamp(parse_duration(every), min_gap, 7 * 86400)
'''
"report.py" = '''
import utils
from durations import parse_duration


def describe(job, every):
    minutes = parse_duration(every) // 60
    return f"{job} runs every {utils.plural(minutes, 'minute')}"
'''
