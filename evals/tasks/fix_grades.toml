[hidden]
"test_hidden.py" = '''
import unittest

from grades import average, letter, percent


class T(unittest.TestCase):
    def test_average_fraction(self):
        self.assertEqual(average([85, 86]), 85.5)
        self.assertEqual(average([70, 80, 90]), 80)

    def test_average_empty(self):
        self.assertEqual(average([]), 0.0)

    def test_percent(self):
        self.assertEqual(percent(1, 3), 33.3)
        self.assertEqual(percent(3, 4), 75.0)

    def test_letter_boundaries(self):
        self.assertEqual([letter(s) for s in (100, 90, 89.5, 80, 70, 69.5)], ["A", "A", "B", "B", "C", "F"])
'''

[solution]
"grades.py" = '''
def average(scores):
    """The mean of scores, or 0.0 when there are none."""
    return sum(scores) / len(scores) if scores else 0.0


def percent(part, whole):
    """part as a percentage of whole, rounded to one decimal: percent(1, 3) == 33.3."""
    return round(part / whole * 100, 1)


def letter(score):
    """A for 90 and above, B for 80 and above, C for 70 and above, otherwise F."""
    if score >= 90:
        return "A"
    if score >= 80:
        return "B"
    if score >= 70:
        return "C"
    return "F"
'''
