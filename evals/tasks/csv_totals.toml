"test_hidden.py" = '''
import subprocess
import sys
import unittest


def run(path):
    return subprocess.run([sys.executable, "summarize.py", path], capture_output=True, text=True, timeout=30)


class T(unittest.TestCase):
    def test_sales(self):
        self.assertEqual(run("sales.csv").stdout.strip().splitlines(), ["east: 7.00", "north: 12.50", "south: 5.00"])

    def test_other_file(self):
        self.assertEqual(run("other.csv").stdout.strip().splitlines(), ["alpha: 3.33", "beta: 100.00"])
