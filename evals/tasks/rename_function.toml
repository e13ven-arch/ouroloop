prompt = "Rename calc_total to total_price everywhere in this project. The behaviour must stay the same, and the old name should no longer exist."
checks = [
    "python3 -m unittest -q test_hidden.T.test_new_name",
    "python3 -m unittest -q test_hidden.T.test_old_name_gone",
    "python3 -m unittest -q test_hidden.T.test_checkout",
]

[files]
"cart.py" = '''
def calc_total(prices, tax_rate=0.0):
    """The sum of the prices plus tax, rounded to cents."""
    return round(sum(prices) * (1 + tax_rate), 2)
'''
"checkout.py" = '''
from cart import calc_total


def checkout(prices, tax_rate=0.0):
    return f"Total: {calc_total(prices, tax_rate):.2f}"
'''

[hidden]
"test_hidden.py" = '''
import unittest

import cart
import checkout


class T(unittest.TestCase):
    def test_new_name(self):
        self.assertEqual(cart.total_price([1.0, 2.5], 0.1), 3.85)

    def test_old_name_gone(self):
        self.assertFalse(hasattr(cart, "calc_total"))

    def test_checkout(self):
        self.assertEqual(checkout.checkout([10, 5], 0.2), "Total: 18.00")
'''

[solution]
"cart.py" = '''
def total_price(prices, tax_rate=0.0):
    """The sum of the prices plus tax, rounded to cents."""
    return round(sum(prices) * (1 + tax_rate), 2)
'''
"checkout.py" = '''
from cart import total_price


def checkout(prices, tax_rate=0.0):
    return f"Total: {total_price(prices, tax_rate):.2f}"
'''
