[solution]
"roman.py" = '''
SYMBOLS = [(1000, "M"), (900, "CM"), (500, "D"), (400, "CD"), (100, "C"), (90, "XC"), (50, "L"), (40, "XL"),
           (10, "X"), (9, "IX"), (5, "V"), (4, "IV"), (1, "I")]


def to_roman(n):
    """n as a Roman numeral in the usual subtractive form, from the symbols I V X L C D M: to_roman(1994) == "MCMXCIV".
    Raise ValueError unless n is an int from 1 to 3999."""
    if not isinstance(n, int) or not 1 <= n <= 3999:
        raise ValueError(f"not an int from 1 to 3999: {n!r}")
    out = []
    for value, symbol in SYMBOLS:
        count, n = divmod(n, value)
        out.append(symbol * count)
    return "".join(out)


NUMBERS = {to_roman(n): n for n in range(1, 4000)}


def from_roman(s):
    """The number that the Roman numeral s stands for: from_roman("MCMXCIV") == 1994. Accept exactly the strings that
    to_roman returns, in upper case, and raise ValueError for any other string, such as "IIII", "IC" or ""."""
    if s not in NUMBERS:
        raise ValueError(f"not a Roman numeral: {s!r}")
    return NUMBERS[s]
'''
