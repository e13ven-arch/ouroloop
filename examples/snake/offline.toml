# ouroloop demo snake --config examples/snake/offline.toml
# The notebook version: the same loop in a few minutes on any machine, no GPU, no model download, no key. The tiny
# signature model (label counts per local picture of the board, rules.signature) stands in for TDE, and the keyword
# stand-in (knows nothing of Snake) for the general checkpoint. The tiny model sees what the rule snake sees, so it
# only takes over moves the rule snake already gets right: this version shows the machinery, and its games equal
# the baseline's (the brackets); a snake that plays better than the rule snake needs TDE (demo.toml).

seed = 0                        # the runtime's: candidate order and exploration, so a run repeats exactly

[workspace]
root = "workspace-offline"

[demo]
scenario = "examples.snake.scenario:Snake"
path = "../.."
generations = 6
games = 120                     # enough calibration sessions for a 5% threshold by generation 3
plant = 2
seed = 0

[demo.options]
board = 8
change_at = 5
board_after = 10

[demo.gate]
min_cal_sessions = 60
cal_frac = { move = 0.5, "*" = 0.15 }
checks = { min_train = 1000, max_mde = 0.10 }

[backends.base]
type = "mock"

[registry]
base = "base"

[points]
default_backend = "base"

[points.move]
define = "examples.snake.scenario:move_point"
backend = "champion"
act = true
explore = 0.05

[trainer]
type = "signature"
signature = "examples.snake.rules:signature"

[recipe]
min_weight = 1.0
