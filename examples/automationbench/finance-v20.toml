# finance-v20: stage 4p, second cut (docs/DESIGN.md v2.1 §6.24; docs/JOURNAL.md 2026-10-24) — finance-v19 again with
# the improver's session told what it could not see there: the world's sources (task.json `sources`: which data
# sources the request's world holds, as counts, and which the run read), the prompt rewritten around "an unread
# source first, then the derived value's inputs, then the documents", and the session's tools worded for one task.
# The two named finance TRAIN tasks are the ones whose correct figure depends on a correction posted in a chat
# channel the agent never opened (quarterly_tax_estimate: a state-rate change; timesheet_to_invoice: a negotiated
# discount). Pass: R builds the hold that gets the unread source read and the tool that derives from what was read,
# the agent reads the channel on the later encounters, the task passes and holds. The seed is unchanged.
#   1  `... bench --config examples/automationbench/finance-v20.toml --phase smoke --checks-only`                $0
#   2  `... freeze --config ...`; add the printed [rsi] lines (core_ref, split_ref, repeat_plan_ref) and commit    $0
#   3  `... bench --config ... --phase repeat --arm learn` (2 tasks: 3 encounters + up to 4 probes + R's session
#      each, about $10). Approved in chat first (PLAN rule 3).
#   4  `... bench --config ... --phase report`

[workspace]
root = "workspace-finance-v20"

[bench]
domain = "finance"
upstream_path = "~/workspace/AutomationBench"
split_rule = "stratified"
seed = 1
concurrency = 8
ratios = { train = 0.5, dev = 0.0, test = 0.5 }

[model]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 600

[research_model]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 900

[pricing]
input_per_1k = 0.004
cache_read_per_1k = 0.0002
cache_write_per_1k = 0.008
output_per_1k = 0.02
max_input_tokens = 400000
max_output_tokens = 163840
source = "notional, not a bill: claude-opus-5-5 API list price ($4/$20 per M, cache read $0.20, 1h cache write $8)"

[harness]
preset = "automationbench_v2"
seed = "stirrup"

[worker]
network = "none"
image_id = "sha256:e070208dbddc713a9993f6700ab15a0455d44d2f6885f47dafc2f4bfd4436f30"

[memory]
enabled = false

[schedule]
rounds = 1
patience = 1
stream_batch = 30
stream_splits = ["train"]

[budget]
usd = 1000.0

[final]
repeats = 3

[improver]
packages_per_round = 2      # v1.10: candidates/package/ invariant, candidates/package-2/ domain (DESIGN §6.20)
accept_max_regressions = 3  # v1.12 (DESIGN §6.22): net-positive installs, the regressions go to the frontier
accept_floor_tolerance = 3
l5_per_round = 3
trial_max_tasks = 3         # the host's trial after finish, per package; R's own tries share trial_max_attempts (40)

[repeat]
encounters = 3          # each task met three times: the base, then the task's own harness twice
split = "train"         # the focused run stays on train: test is for the sealed number only
tasks = ["finance.quarterly_tax_estimate", "finance.timesheet_to_invoice"]
max_probes = 4          # the learn arm's extra executions a task, at most
feedback = "items"      # the bit per attempt and what each rejected run was sent back for (kinds and objects, no values)
concurrency = 2         # the two tasks in parallel (a machine setting, not in the plan)
arms = ["learn"]        # no control arm in the focused run

[rsi]
scope_id = "finance-v20"
seed_from = "workspace-finance-v9"
seed_line = "working"
# frozen 2026-10-24: the seed is finance-v9's working line (as in v18/v19); the finance two-way split; the repeat
# plan: the two named train tasks x 3 encounters, the learn arm, feedback items — sealed before any attempt
core_ref = "core:sha256:a5543728fbaf809d55732e60bb340225c8a06282492f1d41c6ab50c810294ee7"
split_ref = "3b959d143f9d8468"
repeat_plan_ref = "repeat_plan:sha256:bf601e6f8d999d0e65507269684ca0e66c2c9ed0204ed55fd68756af421a69f3"
