prompt = "median() in stats.py returns the wrong value for some inputs. Fix it without changing mean()."
checks = [
    "python3 -m unittest -q test_hidden.T.test_odd",
    "python3 -m unittest -q test_hidden.T.test_even",
    "python3 -m unittest -q test_hidden.T.test_mean_unchanged",
]

[files]
"stats.py" = '''
def mean(xs):
    return sum(xs) / len(xs)


def median(xs):
    """The middle value of xs; for an even number of values, the mean of the two middle ones."""
    s = sorted(xs)
    return s[len(s) // 2]
'''

[hidden]
"test_hidden.py" = '''
import unittest

from stats import mean, median


class T(unittest.TestCase):
    def test_odd(self):
        self.assertEqual(median([3, 1, 2]), 2)

    def test_even(self):
        self.assertEqual(median([4, 1, 3, 2]), 2.5)

    def test_mean_unchanged(self):
        self.assertEqual(mean([1, 2, 3, 6]), 3)
'''

[solution]
"stats.py" = '''
def mean(xs):
    return sum(xs) / len(xs)


def median(xs):
    """The middle value of xs; for an even number of values, the mean of the two middle ones."""
    s = sorted(xs)
    mid = len(s) // 2
    return s[mid] if len(s) % 2 else (s[mid - 1] + s[mid]) / 2
'''
