import unittest

from versions import compare, latest, parse_version


class T(unittest.TestCase):
    def test_parse(self):
        self.assertEqual(parse_version("1.4.0"), (1, 4, 0, ()))
        self.assertEqual(parse_version("0.10.200-beta.11"), (0, 10, 200, ("beta", "11")))
        self.assertEqual(parse_version("2.0.0-x-y.7"), (2, 0, 0, ("x-y", "7")))

    def test_parse_invalid(self):
        for text in ("", "1.2", "1.2.3.4", "v1.2.3", "01.2.3", "1.02.3", "1.2.3-", "1.2.3-rc..1", "1.2.3-rc_1",
                     " 1.2.3", "1.2.3+build", "a.b.c"):
            with self.assertRaises(ValueError, msg=repr(text)):
                parse_version(text)

    def test_compare_release(self):
        self.assertEqual(compare("1.10.0", "1.9.0"), 1)
        self.assertEqual(compare("1.9.9", "2.0.0"), -1)
        self.assertEqual(compare("0.0.1", "0.1.0"), -1)
        self.assertEqual(compare("1.0.10", "1.0.9"), 1)
        self.assertEqual(compare("3.2.1", "3.2.1"), 0)

    def test_compare_prerelease(self):
        chain = ["2.1.0-2", "2.1.0-10", "2.1.0-10a", "2.1.0-alpha", "2.1.0-alpha.3", "2.1.0-alpha.12",
                 "2.1.0-alpha.x", "2.1.0-beta", "2.1.0", "2.1.1-alpha"]
        for lower, higher in zip(chain, chain[1:]):
            self.assertEqual(compare(lower, higher), -1, (lower, higher))
            self.assertEqual(compare(higher, lower), 1, (higher, lower))
        self.assertEqual(compare("2.1.0-rc.1", "2.1.0-rc.1"), 0)

    def test_latest(self):
        self.assertEqual(latest(["1.2.0", "1.10.0", "1.9.9"]), "1.10.0")
        self.assertEqual(latest(["1.0.0", "2.0.0-rc.1", "1.1.0-beta"]), "1.0.0")
        self.assertEqual(latest(["1.0.0", "2.0.0-rc.1"], include_prerelease=True), "2.0.0-rc.1")
        self.assertIsNone(latest([]))
        self.assertIsNone(latest(["3.0.0-alpha"]))
