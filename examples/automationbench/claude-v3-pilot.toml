# v0.3 step 5's pilot — stage 0 of the staged runbook (docs/ROADMAP.md §3 v0.3 step 5): before the activity's root
# opens, the new R path runs once with the real model — the one exit item step 3 left open (its rehearsal ran
# offline, with a scripted researcher). One real worker round in a workspace of its own: W0's baseline on a small
# two-domain subset, then R's coding session (notes, up to 40 turns of file tools, read_trajectory, finish with
# declarations) at the activity's k = 3, the drafts' checks in the Docker worker, the train-side screen and the dev
# gate. Nothing here enters a claim; no final, no research slot.
#
#   ouroloop bench --config examples/automationbench/claude-v3-pilot.toml --phase cycle --until segment-0/round-0
#
# Go (all of): rsi/events.jsonl has a `research_session` event for round 0 with turns, edits, trajectory reads and
# the way it ended, and its `transcript_ref` names the stored session — R's replies, every tool call with its
# arguments (write_file/edit_file, read_trajectory, finish) and every tool's answer or refusal text; experience.jsonl has the round's ledger rows — `declared` with each candidate's declaration (mechanism,
# site, carrier, predicted_affected, trigger_condition), `drafted` (the checks in the worker passed), `admitted`,
# `screened` (the train tasks, net flips, thin_screen) — and `gated` with the gate's receipt ref (an
# `evaluation_completed` event names it; kind full, or confirmed when the first reading cleared min_gain). If round 0
# ends screened_out (nothing reached the gate), run the same command with `--until segment-0/round-1` for the one
# more round the schedule allows. `--phase report` lists the session, the ledger and the gate. No-go: the session is
# invalid or crashes, no candidate is declared or drafts never pass their checks — fixed offline before any root.
#
# Scaling to the activity (review finding 6: the pilot runs the activity's k = 3, so its session is the activity's
# session): R's cost per round in claude-v3.toml = the pilot's cost per note x 30 (the activity's max_failure_notes;
# the pilot writes one per failed train task, ~6) + the pilot's session cost at k = 3 (it does not grow with the
# domain count: the session reads notes, the package and at most 512 KB of trajectories). The screen scales per
# candidate as (its failing train tasks + 5 passing) x the cost per attempt; the gate as dev tasks x the cost per
# attempt (26 here, 125 there). The pilot's measured cost per attempt at medium is the activity's W0 and candidate
# figure until stage 1 measures it on the five domains.
#
# Sizing (2026-10-05). The v3 preset's gate needs 25 tasks (min_tasks is not lowered: it only tightens), so the
# subset is 26 dev tasks — fewer than 2 x 25, so a research slot here would record no_slot_pool; the schedule asks
# for none (research_slots 0), which also spares the slot's share check against this small root. The domains are
# operations — which step 5 does not use — and Marketing, whose test is spent, so no task of the activity's claim
# (the four new domains' test) is run or read here. Their splits here are this workspace's own (stratified,
# 6 / 13 / 81 per domain; the 162 "test" tasks are simply never run). K's effort ceiling is medium, as in the
# activity.
# Expected nominal spend at $0.45 an attempt (medium): baseline (12 train + 26 dev) $17; round 0: notes and the
# session at k = 3 about $8 (never measured: the pilot measures it), the screen 3 candidates x (~6 failing + 5
# passing) = 33 attempts $15, the gate 26 attempts $11.7 — about $52 in all (k = 3 adds ~$10 of screening over k = 1);
# $64 when the first reading clears and the confirmation runs; about $86 if a second round (without a confirmation)
# is needed. The root is sized for the reservations, not the spend: 4 lanes hold 4 x $7.2768 = $29.1 and one stuck
# settlement $7.3 beside the spend (the pilot makes ~1,000 calls; one stuck in 2,250), so $130 keeps every lane open
# up to $93 of spend (the $86 case included). A hard stop, fixed when the root opens; the money guard is the
# subscription with extra usage turned off.

[workspace]
root = "workspace-claude-v3-pilot"

[bench]
domains = ["operations", "marketing"]
split_rule = "stratified"
upstream_path = "~/workspace/AutomationBench"
toolset = "api"
seed = 1
concurrency = 4
smoke_tasks = 1
near_duplicate_threshold = 0.6

[bench.ratios]                  # per domain 6 train, 13 dev, 81 test: 12 train and 26 dev pooled
train = 0.06
dev = 0.13
test = 0.81

[bench.budget]
max_steps = 50
max_tool_calls = 200
max_seconds = 900
max_model_calls = 200
max_tokens = 400000

[backends.mock]
type = "mock"

[points]
default_backend = "mock"

[llm]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 600

[research.llm]                  # the model under test here: the session's every turn is one of its calls
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 900

[pricing]
input_per_1k = 0.004
cache_read_per_1k = 0.0002
cache_write_per_1k = 0.008
output_per_1k = 0.02
max_input_tokens = 1000000
max_output_tokens = 163840
source = "notional, not a bill: claude-opus-5-5 API list price ($4/$20 per M, cache read $0.20, 1h cache write $8), equal to the CLI's reported cost in the probe (docs/ROADMAP.md §3, step 2a), 2026-10-03"

[improvement]
mode = "automatic"
preset = "automationbench_harness_v3"
allowed_methods = ["policy_edit", "harness_edit"]
max_candidates_per_round = 3    # the activity's k: the session the pilot runs is the one the activity will

[harness_evolution]
package_api = "harness_package.v2"
components = ["agent", "memory", "skills", "on_finish", "before_tool", "after_tool", "tools"]
sandbox = "docker"
max_files = 24
max_package_bytes = 262144
test_timeout_seconds = 30
max_draft_repairs = 3
max_failure_notes = 30
max_effort = "medium"           # narrowed from the preset's high, as in claude-v3.toml

[rsi]
profile = "task"
scope_id = "claude-v3-pilot"
stop_view = "stop.business.v1"
repeats = 1
order_seed = 1
# task_plan_ref / schedule_ref / budget_ref are frozen by the cycle when they are not named here.

[freeze.schedule]               # fewer than the preset allows: two rounds at most, no research slot
worker_rounds = 2
research_slots = 0

[freeze.budget]
usd = 130.0
