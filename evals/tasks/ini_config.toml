"README.md" = '''
# inifile

A reader and writer for INI-style configuration text, in `inifile.py`. Standard library only; do not use
`configparser`.

## `loads(text)`

Returns a dict that maps each section name to a dict of that section's keys and values. Every key and value is a
string. The text is read line by line:

- A blank line, or a line whose first non-whitespace character is `#` or `;`, is skipped.
- `[name]` starts a section. Whitespace around the line and around the name is ignored, so `  [ server ]` starts the
  section `server`. Section names keep their letter case. A section that appears again continues the same section.
  A section without keys is still in the result.
- `key = value` sets a key in the current section. Only the first `=` splits the line, so the value may contain more
  `=` signs. Key and value are stripped of surrounding whitespace, and the value may be empty. Keys are stored in
  lower case, and a later value for a key replaces the earlier one.
- A value that starts and ends with a double quote (at least two characters) loses those two quotes and keeps
  everything between them exactly, so `motto = " be kind "` gives a value that starts and ends with a space.
- There are no inline comments: `a = 1 # one` has the value `1 # one`.
- Keys that come before the first section header belong to the section `""` (the empty string). That section is in
  the result only if it has a key.
- Any other line raises `ParseError`, a subclass of `ValueError` whose `lineno` attribute is the number of the line,
  counting from 1. That includes a line without `=` and a line whose key is empty.

## `dumps(data)`

The reverse of `loads`, for a dict like the ones `loads` returns: `loads(dumps(data)) == data`.

- The `""` section, if present, comes first, as `key = value` lines without a header. Every other section follows in
  the order of the dict, as a `[name]` line and then its `key = value` lines in the order of its dict.
- Each key line is the key, a space, `=`, a space and the value. A value with whitespace at either end, or that
  starts with a double quote, is written inside double quotes; any other value is written as it is.
- Sections are separated by one empty line, and the text ends with a single newline. `dumps({})` is `""`.

## Example

```
name = demo

[server]
host = example.org
Port = 8080
```

`loads` gives `{"": {"name": "demo"}, "server": {"host": "example.org", "port": "8080"}}`, and `dumps` of that dict
gives the same text with `port` in lower case.
'''

