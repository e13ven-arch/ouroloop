"invoice.py" = '''
def render(lines):
    """A text table of invoice lines, each an (item, qty, price) tuple, as one string of lines joined by newlines.

    - The columns are item, qty, price and amount (qty * price); the first line is a header with those names.
    - price and amount have two decimals and a comma every three digits: 1,250.00. qty is printed as it is.
    - Rows are sorted by amount, largest first; rows with equal amounts keep their order.
    - The last line has TOTAL as its item and the sum of the amounts as its amount; its qty and price are empty.
    - Each column is as wide as its widest cell, header included, and columns are separated by two spaces. The item
      column is left-aligned and the other columns are right-aligned, header included.

    render([("pen", 10, 1.5), ("desk", 1, 1250), ("lamp", 2, 45.25)]) returns these lines:

        item   qty     price    amount
        desk     1  1,250.00  1,250.00
        lamp     2     45.25     90.50
        pen     10      1.50     15.00
        TOTAL                 1,355.50
    """
    out = ["item qty price amount"]
    for item, qty, price in lines:
        out.append(f"{item} {qty} {price} {qty * price}")
    return "\n".join(out)
'''

