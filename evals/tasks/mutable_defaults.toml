prompt = "In playlist.py, playlists made without a song list share their songs with each other, and player_settings() leaks one call's overrides into the next call. Fix both. Neither Playlist nor player_settings() may change a list or dict the caller passes in, nor DEFAULTS."
max_turns = 12
checks = [
    "python3 -m unittest -q test_hidden.T.test_playlists_independent",
    "python3 -m unittest -q test_hidden.T.test_playlist_keeps_caller_list",
    "python3 -m unittest -q test_hidden.T.test_settings_no_leak",
    "python3 -m unittest -q test_hidden.T.test_settings_keeps_caller_base",
]

[files]
"playlist.py" = '''
DEFAULTS = {"shuffle": False, "volume": 5}


class Playlist:
    def __init__(self, name, songs=[]):
        self.name = name
        self.songs = songs

    def add(self, song):
        self.songs.append(song)


def player_settings(overrides, base=DEFAULTS):
    """The settings for one player: base with overrides applied on top."""
    base.update(overrides)
    return base
'''

[hidden]
"test_hidden.py" = '''
import unittest

from playlist import DEFAULTS, Playlist, player_settings


class T(unittest.TestCase):
    def test_playlists_independent(self):
        a, b = Playlist("a"), Playlist("b")
        a.add("x")
        self.assertEqual(a.songs, ["x"])
        self.assertEqual(b.songs, [])

    def test_playlist_keeps_caller_list(self):
        songs = ["x"]
        p = Playlist("p", songs)
        p.add("y")
        self.assertEqual(p.songs, ["x", "y"])
        self.assertEqual(songs, ["x"])

    def test_settings_no_leak(self):
        self.assertEqual(player_settings({"volume": 9}), {"shuffle": False, "volume": 9})
        self.assertEqual(player_settings({}), {"shuffle": False, "volume": 5})
        self.assertEqual(DEFAULTS, {"shuffle": False, "volume": 5})

    def test_settings_keeps_caller_base(self):
        base = {"volume": 1}
        self.assertEqual(player_settings({"shuffle": True}, base), {"volume": 1, "shuffle": True})
        self.assertEqual(base, {"volume": 1})
'''

[solution]
"playlist.py" = '''
DEFAULTS = {"shuffle": False, "volume": 5}


class Playlist:
    def __init__(self, name, songs=None):
        self.name = name
        self.songs = list(songs or [])

    def add(self, song):
        self.songs.append(song)


def player_settings(overrides, base=DEFAULTS):
    """The settings for one player: base with overrides applied on top."""
    return {**base, **overrides}
'''
