prompt = "ranges.py drops items at the end: chunks() loses the last, shorter chunk and windows() loses the last window. Fix every function in ranges.py so that it matches its docstring."
max_turns = 10
checks = [
    "python3 -m unittest -q test_hidden.T.test_chunks",
    "python3 -m unittest -q test_hidden.T.test_windows",
    "python3 -m unittest -q test_hidden.T.test_windows_short",
    "python3 -m unittest -q test_hidden.T.test_span",
]

[files]
"ranges.py" = '''
def chunks(xs, size):
    """xs split into consecutive lists of size items; the last one may be shorter."""
    return [xs[i:i + size] for i in range(0, len(xs) - size + 1, size)]


def windows(xs, k):
    """Every run of k consecutive items of xs, in order, and [] when xs has fewer than k items:
    windows([1, 2, 3], 2) == [[1, 2], [2, 3]]."""
    return [xs[i:i + k] for i in range(len(xs) - k)]


def span(first, last):
    """The whole numbers from first to last, both included."""
    return list(range(first, last))
'''

