# finance-v19: stage 4p, the focused run (docs/DESIGN.md v2.1 §6.24; docs/JOURNAL.md 2026-10-24) — the repetitive
# stream on THREE named finance TRAIN tasks whose first-pass failure fell on a derived value (a tax estimate, an
# hours x rate total, a three-way match with tolerance): quarterly_tax_estimate, timesheet_to_invoice,
# po_three_way_match (finance-v13's baseline failed them; finance-v16 did not run them; no code has solved them).
# What changes against finance-v18: the feedback is the rejected items (`feedback = "items"`: the failed checks' kinds
# and objects, never the expected values), the improver's session is told to carry a derived value's step as a tool
# the agent calls, a candidate changed after its try may be tried again, and the plan names its tasks. Pass: the
# adopted package holds a tool, the probe's and the later encounters' footprints show the agent calling it, the task
# passes and holds. The seed is unchanged (finance-v9's working line, as in v18).
#   1  `... bench --config examples/automationbench/finance-v19.toml --phase smoke --checks-only`                $0
#   2  `... freeze --config ...`; add the printed [rsi] lines (core_ref, split_ref, repeat_plan_ref) and commit    $0
#   3  `... bench --config ... --phase repeat --arm learn` (3 tasks: 3 encounters + up to 4 probes + R's session
#      each, about $30). Approved in chat first (PLAN rule 3).
#   4  `... bench --config ... --phase report`
#
# Money: the root is written as $1000 so the arm's account has room; the approval is the sum above, not the root.

[workspace]
root = "workspace-finance-v19"

[bench]
domain = "finance"
upstream_path = "~/workspace/AutomationBench"
split_rule = "stratified"
seed = 1
concurrency = 8
ratios = { train = 0.5, dev = 0.0, test = 0.5 }

[model]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 600

[research_model]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 900

[pricing]
input_per_1k = 0.004
cache_read_per_1k = 0.0002
cache_write_per_1k = 0.008
output_per_1k = 0.02
max_input_tokens = 400000
max_output_tokens = 163840
source = "notional, not a bill: claude-opus-5-5 API list price ($4/$20 per M, cache read $0.20, 1h cache write $8)"

[harness]
preset = "automationbench_v2"
seed = "stirrup"

[worker]
network = "none"
image_id = "sha256:e070208dbddc713a9993f6700ab15a0455d44d2f6885f47dafc2f4bfd4436f30"

[memory]
enabled = false

[schedule]
rounds = 1
patience = 1
stream_batch = 30
stream_splits = ["train"]

[budget]
usd = 1000.0

[final]
repeats = 3

[improver]
packages_per_round = 2      # v1.10: candidates/package/ invariant, candidates/package-2/ domain (DESIGN §6.20)
accept_max_regressions = 3  # v1.12 (DESIGN §6.22): net-positive installs, the regressions go to the frontier
accept_floor_tolerance = 3
l5_per_round = 3
trial_max_tasks = 3         # the host's trial after finish, per package; R's own tries share trial_max_attempts (40)

[repeat]
encounters = 3          # each task met three times: the base, then the task's own harness twice
split = "train"         # the focused run stays on train: test is for the sealed number only
tasks = ["finance.quarterly_tax_estimate", "finance.timesheet_to_invoice", "finance.po_three_way_match"]
max_probes = 4          # the learn arm's extra executions a task, at most
feedback = "items"      # the bit per attempt and what each rejected run was sent back for (kinds and objects, no values)
concurrency = 3         # the three tasks in parallel (a machine setting, not in the plan)
arms = ["learn"]        # no control arm in the focused run

[rsi]
scope_id = "finance-v19"
seed_from = "workspace-finance-v9"
seed_line = "working"
# frozen 2026-10-24: the seed is finance-v9's working line (as in v18); the finance two-way split; the repeat plan:
# the three named train tasks x 3 encounters, the learn arm, feedback items — sealed before any attempt
core_ref = "core:sha256:e5bdf5e5d50004e4eb87addb89fd3a86bb80dec976a6f875ea0ad21f4d7a721a"
split_ref = "3b959d143f9d8468"
repeat_plan_ref = "repeat_plan:sha256:60407fb06f22202c2f2e653938fd490014247a2c97b36a05039d6eb9e55d3f3d"
