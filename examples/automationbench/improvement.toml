# The first version's automatic loop on AutomationBench Marketing (docs/modules/07_BENCH_REPORT.md §1–2).
#
# One command runs it:
#
#   ouroloop bench --config examples/automationbench/improvement.toml --phase cycle
#
# The cycle freezes what [rsi] does not name yet (the development plan and the schedule from the preset, the
# budget from [freeze.budget]), runs the starting version's baseline once, then a worker segment, the planned
# research slot, and one more worker segment that shows whether an installed R is actually used; it ends with the
# offline report. It never runs the final split. Interrupted, the same command resumes where it stopped and pays
# for nothing already on record. The phases it calls remain available on their own for debugging and resuming:
#
#   ouroloop bench --config examples/automationbench/improvement.toml --phase smoke --checks-only
#   ouroloop bench --config examples/automationbench/improvement.toml --phase report
#
# An installed version is exported as a minimal app, and loaded from that directory alone:
#
#   ouroloop export --config examples/automationbench/improvement.toml --to exported-marketing
#
# Package code runs only in the isolated worker, a fixed Docker image built once from this checkout:
#
#   docker build -f docker/worker.Dockerfile -t ouroloop-worker:py3.12 .
#
# Without Docker, narrow [harness_evolution] components to ["memory", "skills"]: the loop then evolves text only,
# and nothing needs the worker. A preset is never widened from here.
#
# No secret is in this file: the key is read from the variable api_key_env names, loaded from env_file.

env_file = "../../.env"

[workspace]
root = "workspace-improvement"

[bench]
domain = "marketing"
upstream_path = "~/workspace/AutomationBench"
toolset = "api"
seed = 1                        # fixed before the first run: it decides the split
smoke_tasks = 1
near_duplicate_threshold = 0.6

[bench.ratios]
train = 0.5
dev = 0.25
test = 0.25

[bench.budget]                  # the same per-attempt limits for every version compared
max_steps = 50
max_tool_calls = 200
max_seconds = 900

[backends.mock]
type = "mock"

[points]
default_backend = "mock"        # the first version runs no decision model

# The actor W0 pins, and the research model: GLM-5.3 on Z.AI's OpenAI-compatible endpoint. A hosted alias is
# recorded as mutable with when it was seen, not as frozen weights (docs/modules/00_CONTRACTS.md §2).
[llm]
type = "openai_compat"
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "ZHIPUAI_API_KEY"
model = "glm-5.3"
max_tokens = 16384
source = "frontier_llm"         # a hosted model's answers are never a training target

# Every paid call is reserved and settled in USD at these prices. Check them before a run: a price that changed
# is a different budget (Z.AI list prices for GLM-5.3, docs.z.ai/guides/overview/pricing, 2026-09-28).
[pricing]
input_per_1k = 0.0014
cache_read_per_1k = 0.00026
output_per_1k = 0.0044
max_input_tokens = 1000000
max_output_tokens = 16384
source = "Z.AI list price for GLM-5.3, docs.z.ai/guides/overview/pricing, 2026-09-28"

# The automatic loop and its preset. The preset fixes the package limits, the note and draft limits, the gate's
# min_gain/max_regression_rate, the schedule (3 worker rounds per segment, 1 research slot, patience 2) and the
# research slot's pair rule; freeze writes them into K, after which R cannot raise any of them.
[improvement]
mode = "automatic"
preset = "marketing_harness_v1"
allowed_methods = ["policy_edit", "harness_edit"]
max_candidates_per_round = 1
max_collection_batches = 2      # per worker segment; a restart does not reset it

# Narrowing the preset (never widening it). These are the preset's own values, written out so they are visible.
[harness_evolution]
package_api = "harness_package.v1"
components = ["memory", "skills", "on_finish", "before_tool", "after_tool", "tools"]
sandbox = "docker"
max_files = 24
max_package_bytes = 262144
test_timeout_seconds = 30
max_draft_repairs = 3           # revisions after the first draft, so at most 4 drafts
max_failure_notes = 30          # notes one summary call reads, cached and new together

[rsi]
profile = "task"
scope_id = "marketing-improvement"
stop_view = "stop.business.v1"
repeats = 1
order_seed = 1
# task_plan_ref / schedule_ref / budget_ref are frozen by the cycle when they are not named here.

# The whole activity's budget: every phase, the research slot's two arms and its outer comparison. Each arm gets
# the preset's fixed share of it. A cycle without a budget is refused before anything is paid for.
[freeze.budget]
usd = 120.0
