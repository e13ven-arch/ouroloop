    def test_old_name_warns(self):
        from accounts.users import get_user_name
        with self.assertWarns(DeprecationWarning):
            self.assertEqual(get_user_name(User("Ada", "Lovelace")), "Ada Lovelace")

    def test_old_name_from_package(self):
        from accounts import get_user_name
        with self.assertWarns(DeprecationWarning):
            self.assertEqual(get_user_name(User("Ada", "Lovelace", "ada")), "ada")

    def test_callers_updated(self):
        import greet
        import roster
        with warnings.catch_warnings():
            warnings.simplefilter("error")
            self.assertEqual(greet.greet(User("Alan", "Turing")), "Hello, Alan Turing!")
            self.assertEqual(roster.roster([User("Grace", "Hopper"), User("Ada", "Lovelace", "ada")]),
