"versions.py" = '''
import re

VERSION = re.compile(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?")


def parse_version(text):
    """Split a version "MAJOR.MINOR.PATCH" or "MAJOR.MINOR.PATCH-PRERELEASE" into (major, minor, patch, prerelease):
    three ints and a tuple of the prerelease's dot-separated identifiers (empty when there is none), so
    parse_version("1.4.0-rc.1") == (1, 4, 0, ("rc", "1")).

    MAJOR, MINOR and PATCH are runs of digits without leading zeros ("0" is fine, "07" is not). Each prerelease
    identifier is a non-empty run of ASCII letters, digits and "-". Raise ValueError for any other text."""
    m = VERSION.fullmatch(text)
    if not m:
        raise ValueError(f"not a version: {text!r}")
    major, minor, patch, pre = m.groups()
    return int(major), int(minor), int(patch), tuple(pre.split(".")) if pre else ()


def _key(text):
    major, minor, patch, pre = parse_version(text)
    # A release sorts after its prereleases; numeric identifiers sort before the others.
    ids = tuple((0, int(i), "") if i.isdigit() else (1, 0, i) for i in pre)
    return major, minor, patch, not pre, ids


def compare(a, b):
    """-1, 0 or 1 as the version a is lower than, equal to or higher than the version b (both strings).

    MAJOR, MINOR and PATCH compare as numbers, in that order. When all three are equal, a version with a prerelease
    is lower than one without. Two prereleases compare identifier by identifier from the left: an identifier of
    digits only compares as a number and is lower than any identifier with other characters; other identifiers
    compare as strings. If one prerelease runs out of identifiers first and all before were equal, it is lower."""
    ka, kb = _key(a), _key(b)
    return (ka > kb) - (ka < kb)


def latest(versions, include_prerelease=False):
    """The highest of the version strings, exactly as given, or None when there is none. Versions with a prerelease
    are left out unless include_prerelease is true."""
    candidates = [v for v in versions if include_prerelease or not parse_version(v)[3]]
    return max(candidates, key=_key, default=None)
'''
