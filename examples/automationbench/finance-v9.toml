# finance-v9: the first run of stage 4j (docs/DESIGN.md v1.9 §6.19; docs/JOURNAL.md 2026-10-19): R builds against
# the studied failures, runs its package on up to trial_max_tasks of them (role `trial`, at most trial_max_rounds
# revisions within trial_max_attempts) and only a package with trial_min_fixes in-sample fixes is screened for
# regressions; a tool/hook/skill package regresses only where a component acted; the frontier keeps fix evidence and
# a merge is replayed on the entry's fixed attempts before it is screened. The cheap shape agreed on 2026-10-19: one
# batch round over finance-v8's 150 first encounters (imported, $0: the same AttemptIdentity — attempt code
# 8d3d2d25d7d619b6, finance-v6's working package, the frozen split 1bbf01533d7256af, the worker image by id), one
# package per round, the screen on all 60 held-out tasks with its confirmations, nothing installed without the
# zero-regression rule. Every paid step is approved in chat first (PLAN rule 3).
#   1  `... bench --config examples/automationbench/finance-v9.toml --phase smoke --checks-only`                 $0
#   2  `... freeze --config ...`; add the printed [rsi] lines (core_ref, split_ref) and commit                    $0
#   3  import finance-v8's readings (activity.phases.import_baseline; the round phase itself imports nothing)     $0
#   4  `... bench --config ... --phase round --round 0` (round r0: diagnosis, R's session, the trial, one screen of
#      60 held-out tasks plus confirmations; approved at $150 on 2026-10-19)
#   5  stop; JOURNAL and PLAN. A second round, a release or a final needs its own approval.
#
# Money: a round's account is round_share (0.15, a cap the config cannot raise) of the root's dollars, so the root is
# written as $1000 to give round r0 a $150 account; the root's figure is that arithmetic, not an approval — only
# round r0 is approved and run, and every later phase is approved in chat before it starts. No final share is set
# aside (a final needs its own decision).

[workspace]
root = "workspace-finance-v9"

[bench]
domains = ["finance", "hr", "operations"]
upstream_path = "~/workspace/AutomationBench"
split_rule = "stratified"
seed = 1
concurrency = 8
ratios = { train = 0.5, dev = 0.0, test = 0.5 }

[model]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 600

[research_model]
type = "claude_code"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 32000
timeout = 900

[pricing]
input_per_1k = 0.004
cache_read_per_1k = 0.0002
cache_write_per_1k = 0.008
output_per_1k = 0.02
max_input_tokens = 400000
max_output_tokens = 163840
source = "notional, not a bill: claude-opus-5-5 API list price ($4/$20 per M, cache read $0.20, 1h cache write $8)"

[harness]
preset = "automationbench_v2"
seed = "stirrup"

[worker]
network = "none"
image_id = "sha256:e070208dbddc713a9993f6700ab15a0455d44d2f6885f47dafc2f4bfd4436f30"

[memory]
enabled = false

[schedule]
rounds = 1
patience = 1
stream_batch = 30
stream_splits = ["train"]

[budget]
usd = 1000.0

[final]
repeats = 3
domains = ["finance"]

[improver]
packages_per_round = 1

[rsi]
scope_id = "finance-v9"
seed_from = "workspace-finance-v8"
seed_line = "working"
baseline_from = "workspace-finance-v8"
# frozen 2026-10-19 on stage 4j's code (042944d): the seed is finance-v8's working line (its own seed, nothing
# was installed there), W package:e38c14942fbf; the split is finance-v8's, unchanged
core_ref = "core:sha256:cbe73108ba7046c4591c6f9e53d4b08cf259c3c7cfc478fc4648098a3c71257e"
split_ref = "1bbf01533d7256af"
