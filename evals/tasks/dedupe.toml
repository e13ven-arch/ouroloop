[solution]
"listutil.py" = '''
def dedupe(items, key=None):
    """The items without repeats, keeping the first occurrence of each and the original order. With key, two items
    repeat each other when key(item) is equal. items may be any iterable; the result is a list."""
    seen, out = set(), []
    for item in items:
        k = key(item) if key else item
        if k not in seen:
            seen.add(k)
            out.append(item)
    return out
'''
