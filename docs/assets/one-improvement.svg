<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  </defs>
  <rect width="1400" height="620" fill="#ffffff"/>
  <text x="30" y="34" font-size="22" font-weight="700" fill="#0f172a">How one improvement happens</text>
  <text x="30" y="54" fill="#475569">a quarterly tax estimate request, met three times (finance-v24, effort max): the first run was returned, one Revision Session corrected it, the later runs held</text>

  <!-- retry loop, drawn above row 1 -->
  <path d="M 1210 86 L 1210 76 L 525 76 L 525 86" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <rect x="683" y="68" width="370" height="18" fill="#ffffff"/>
  <text x="868" y="81" text-anchor="middle" fill="#334155" font-size="13">returned, and probes left: change the candidate, probe again</text>

  <!-- ===== row 1: panels 1-4 ===== -->
  <g fill="#1f2937">
    <rect x="30" y="86" width="310" height="196" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="52" cy="108" r="12" fill="#ea580c"/><text x="52" y="113" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">1</text>
    <text x="72" y="113" font-weight="700" font-size="16">First Pass — returned</text>
    <text x="46" y="142">The agent reads the sheets and the mail,</text>
    <text x="46" y="160">estimates the quarter at a 5% state rate,</text>
    <text x="46" y="178">and emails <tspan font-weight="600">$23,625</tspan>.</text>
    <text x="46" y="204" fill="#9a3412">It never opened the chat channel where</text>
    <text x="46" y="222" fill="#9a3412">the rate change to 4.5% was posted.</text>
    <text x="46" y="250" fill="#6b7280">scored on the host; the verdict: returned</text>
    <text x="46" y="268" fill="#6b7280">(the session will never see the expected figure)</text>

    <rect x="370" y="86" width="310" height="196" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="392" cy="108" r="12" fill="#2563eb"/><text x="392" y="113" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">2</text>
    <text x="412" y="113" font-weight="700" font-size="16">Revision Session — reads the run</text>
    <text x="386" y="142">Run Digest: seven searches, no channel</text>
    <text x="386" y="160">read, one email sent, the final text.</text>
    <text x="386" y="178">Source Inventory: <tspan font-weight="600">chat — never read</tspan>.</text>
    <text x="386" y="196">Rejected Check: the estimate email.</text>
    <text x="386" y="222" fill="#1e3a8a">No score, no expected value, no hint of</text>
    <text x="386" y="240" fill="#1e3a8a">what the figure should have been.</text>
    <text x="386" y="268" fill="#6b7280">diagnosis: a value derived, sources unread</text>

    <rect x="710" y="86" width="310" height="196" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="732" cy="108" r="12" fill="#2563eb"/><text x="732" y="113" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">3</text>
    <text x="752" y="113" font-weight="700" font-size="16">Candidate — three components</text>
    <text x="726" y="142"><tspan font-weight="600">Source Coverage Guard</tspan>: before the</text>
    <text x="726" y="160">first write, open every unread source.</text>
    <text x="726" y="182"><tspan font-weight="600">Routing Guard</tspan>: a derived figure goes</text>
    <text x="726" y="200">through the tool, not the model's head.</text>
    <text x="726" y="222"><tspan font-weight="600">Estimate Tool</tspan>: annualise the year to</text>
    <text x="726" y="240">date, blend the rate across the quarter.</text>
    <text x="726" y="268" fill="#6b7280">Preflight Checks passed, at no cost</text>

    <rect x="1050" y="86" width="320" height="196" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="1072" cy="108" r="12" fill="#2563eb"/><text x="1072" y="113" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">4</text>
    <text x="1092" y="113" font-weight="700" font-size="16">Live Probes — the same request</text>
    <text x="1066" y="142">Each candidate runs the request for real;</text>
    <text x="1066" y="160">only the verdict comes back.</text>
    <text x="1066" y="186">1 · by hand · $105,725</text>
    <text x="1356" y="186" text-anchor="end" fill="#b91c1c">returned</text>
    <text x="1066" y="206">2 · tool, un-annualised · $23,448</text>
    <text x="1356" y="206" text-anchor="end" fill="#b91c1c">returned</text>
    <text x="1066" y="226">3 · tool, annualised · <tspan font-weight="600">$105,792</tspan></text>
    <text x="1356" y="226" text-anchor="end" fill="#15803d" font-weight="600">accepted</text>
    <text x="1066" y="252" fill="#6b7280">at most four probes; an unchanged candidate</text>
    <text x="1066" y="270" fill="#6b7280">is refused; what ran is what is kept</text>
  </g>
  <line x1="340" y1="184" x2="370" y2="184" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="680" y1="184" x2="710" y2="184" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1020" y1="184" x2="1050" y2="184" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== row 2: panels 5-7, right to left ===== -->
  <g fill="#1f2937">
    <rect x="1050" y="330" width="320" height="150" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <circle cx="1072" cy="352" r="12" fill="#15803d"/><text x="1072" y="357" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">5</text>
    <text x="1092" y="357" font-weight="700" font-size="16">Per-Task Adoption</text>
    <text x="1066" y="386">The candidate whose probe was accepted</text>
    <text x="1066" y="404">becomes this request's harness, as it ran.</text>
    <text x="1066" y="428" fill="#14532d">No judge model, no person. Every other</text>
    <text x="1066" y="446" fill="#14532d">task keeps the base; nothing can regress.</text>
    <text x="1066" y="470" fill="#6b7280">on record: the adopted tree and the reason</text>

    <rect x="710" y="330" width="310" height="150" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="732" cy="352" r="12" fill="#15803d"/><text x="732" y="357" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">6</text>
    <text x="752" y="357" font-weight="700" font-size="16">Steady State — encounters 2 and 3</text>
    <text x="726" y="386">The guard fires, the channel is read,</text>
    <text x="726" y="404">the tool is called, the email says</text>
    <text x="726" y="424"><tspan font-weight="600">$105,792</tspan> — twice, <tspan fill="#15803d" font-weight="600">accepted</tspan> both times.</text>
    <text x="726" y="452" fill="#6b7280">first pass returned → steady state held</text>
    <text x="726" y="470" fill="#6b7280">(at medium effort this task never held)</text>

    <rect x="370" y="330" width="310" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="392" cy="352" r="12" fill="#475569"/><text x="392" y="357" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">7</text>
    <text x="412" y="357" font-weight="700" font-size="16">Experience Library</text>
    <text x="386" y="386">one entry: the adopted tree, its lesson.</text>
    <text x="386" y="404">Cue: a source was searched, never read.</text>
    <text x="386" y="422">Lesson: open every source before deriving.</text>
    <text x="386" y="440">Evidence: $23,625 → $105,792.</text>
    <text x="386" y="470" fill="#6b7280">read first by the next session</text>
  </g>
  <path d="M 1210 282 L 1210 330" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <text x="1222" y="312" fill="#15803d" font-size="13">accepted</text>
  <line x1="1050" y1="405" x2="1020" y2="405" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1035" y="395" text-anchor="middle" fill="#334155" font-size="12">runs</text>
  <path d="M 1050 460 L 1035 460 L 1035 500 L 700 500 L 700 460 L 680 460" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ad)"/>
  <text x="868" y="516" text-anchor="middle" fill="#64748b" font-size="12">the adopted tree and its lesson enter the library</text>
  <path d="M 525 330 L 525 282" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ad)"/>
  <text x="515" y="310" text-anchor="end" fill="#64748b" font-size="12">read first by the next returned request's session</text>

  <!-- the scorer line -->
  <rect x="30" y="540" width="1340" height="54" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="50" y="562" font-weight="600" fill="#9f1239">Host-Side Scorer, at every step</text>
  <text x="50" y="582" fill="#9f1239" font-size="13">the first pass, each probe and the later encounters are scored on the host; the grading rows never leave it — the session sees the verdict and, at the items tier, which check failed, never the expected $105,792</text>
  <path d="M 185 540 L 185 282" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#ar)"/>
  <path d="M 865 540 L 865 480" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#ar)"/>
</svg>
